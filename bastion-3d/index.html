<title>Bastion des Royaumes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: plein écran 3D, HUD flottant aux quatre coins, panneaux en bas */
:root{
  --sky:#8fcbee; --panel:#1f2d45; --panel2:#2c3f5f; --edge:#0c1424;
  --ink:#ffffff; --muted:#b9c7de; --gold:#ffcc33; --mana:#c867ff; --gem:#38e08c;
  --ok:#5fcf3a; --okd:#2f7d18; --bad:#e2483d; --badd:#8c1e16; --warm:#ff9d2e; --warmd:#a2520a;
  --f-display:'Lilita One','Arial Black',Impact,sans-serif; --f-body:'Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ui{position:fixed;inset:0;pointer-events:none;font-weight:800}
#ui *{box-sizing:border-box}
.pe{pointer-events:auto}
.out{text-shadow:0 2px 0 var(--edge),1px 0 0 var(--edge),-1px 0 0 var(--edge),0 -1px 0 var(--edge)}
b,.num{font-variant-numeric:tabular-nums}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;gap:6px}
#topL{left:calc(env(safe-area-inset-left,0px) + 8px)}
#topR{right:calc(env(safe-area-inset-right,0px) + 8px);align-items:flex-end}
#topC{left:50%;transform:translateX(-50%);align-items:center}
.chip{display:flex;align-items:center;gap:6px;background:rgba(15,24,40,.72);border:2px solid rgba(0,0,0,.4);border-radius:10px;padding:3px 10px 3px 4px;font-family:var(--f-display);font-size:15px;letter-spacing:.3px}
.lvl-badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#7fd0ff,#1d6fd0);border:2px solid var(--edge);font-size:15px}
.cup{width:22px;height:22px;border-radius:4px 4px 10px 10px;background:linear-gradient(#ffe27a,#d99a12);border:2px solid var(--edge)}
.xpbar{width:70px;height:8px;border-radius:5px;background:#0b1220;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd0ff,#3d8bff)}
.res{position:relative;display:flex;align-items:center;justify-content:flex-end;width:158px;height:28px}
.res .bar{position:absolute;inset:4px 14px 4px 0;background:rgba(10,16,30,.75);border:2px solid rgba(0,0,0,.45);border-radius:8px;overflow:hidden}
.res .bar i{position:absolute;inset:0 auto 0 0;width:0}
.res.gold .bar i{background:linear-gradient(#ffe16b,#e0a10f)}
.res.mana .bar i{background:linear-gradient(#e3a3ff,#9a2fe0)}
.res.gems .bar i{background:linear-gradient(#8ff5bd,#1fa862);width:100%}
.res b{position:relative;font-family:var(--f-display);font-size:16px;margin-right:34px}
.res small{position:absolute;right:36px;top:-11px;font-size:10px;color:var(--muted)}
.ico{position:relative;display:inline-block;width:28px;height:28px;flex:none}
.ico.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffcc33 45%,#b97b06);border:2px solid var(--edge)}
.ico.drop{border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 35%,#f4d0ff,#c867ff 45%,#6a14a8);border:2px solid var(--edge)}
.ico.gem{transform:rotate(45deg) scale(.78);border-radius:5px;background:linear-gradient(135deg,#c8ffe0,#38e08c 50%,#0f7d45);border:2px solid var(--edge)}
.ico.sm{width:16px;height:16px;border-width:1.5px;vertical-align:-3px}
.res .ico{position:absolute;right:0;top:0}
.btn{pointer-events:auto;font-family:var(--f-display);font-size:16px;color:#fff;letter-spacing:.4px;border:2px solid var(--edge);border-radius:12px;padding:8px 14px;cursor:pointer;background:linear-gradient(#6fa7ff,#2d67d6);box-shadow:0 4px 0 #173c80,inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 2px 0 rgba(0,0,0,.45);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #173c80}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.ok{background:linear-gradient(#8be35d,var(--ok));box-shadow:0 4px 0 var(--okd),inset 0 2px 0 rgba(255,255,255,.35)}
.btn.bad{background:linear-gradient(#ff7a6c,var(--bad));box-shadow:0 4px 0 var(--badd),inset 0 2px 0 rgba(255,255,255,.35)}
.btn.warm{background:linear-gradient(#ffc066,var(--warm));box-shadow:0 4px 0 var(--warmd),inset 0 2px 0 rgba(255,255,255,.35)}
.btn.gemb{background:linear-gradient(#78f0b0,#1fa862);box-shadow:0 4px 0 #0c6234,inset 0 2px 0 rgba(255,255,255,.35)}
.btn[disabled]{filter:grayscale(.85) brightness(.8)}
.corner{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:10px}
#cornerL{left:calc(env(safe-area-inset-left,0px) + 10px)}
#cornerR{right:calc(env(safe-area-inset-right,0px) + 10px);align-items:flex-end}
.big{width:86px;height:86px;border-radius:18px;font-size:17px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.big .glyph{font-size:30px;line-height:1}
.mid{width:70px;height:56px;border-radius:14px;font-size:14px;padding:0}
#sel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(94vw,440px);display:flex;flex-direction:column;align-items:center;gap:8px}
#selName{font-family:var(--f-display);font-size:20px;text-align:center}
#selInfo{font-size:12px;color:#e8f0ff;text-align:center;background:rgba(10,18,32,.6);border-radius:8px;padding:3px 10px}
#selBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#selBtns .btn{min-width:84px;font-size:14px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
#selBtns .btn small{font-family:var(--f-body);font-weight:900;font-size:12px}
#placeBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:12px;align-items:center}
#placeHint{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 78px);font-size:13px;background:rgba(10,18,32,.7);padding:5px 12px;border-radius:10px;white-space:nowrap}
#modal{position:absolute;inset:0;background:rgba(5,10,20,.55);display:grid;place-items:center;pointer-events:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.panel{width:min(100%,720px);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(var(--panel2),var(--panel));border:3px solid var(--edge);border-radius:18px;box-shadow:0 10px 0 rgba(0,0,0,.35);overflow:hidden}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px 16px;background:rgba(0,0,0,.22)}
.panel h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.5px}
#mBody{overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs .btn{font-size:14px;padding:6px 12px}
.tabs .btn.on{background:linear-gradient(#ffe16b,#e0a10f);box-shadow:0 4px 0 #8a5f05;color:#3a2600;text-shadow:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.card{pointer-events:auto;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:linear-gradient(#f4e7c8,#d9c398);color:#3b2a12;border:3px solid var(--edge);border-radius:14px;padding:6px 6px 8px;cursor:pointer;text-align:center;font-family:var(--f-body)}
.card:active{transform:scale(.97)}
.card.off{filter:grayscale(.9) brightness(.75);cursor:default}
.card img{width:100%;aspect-ratio:1;max-width:120px;object-fit:contain;background:radial-gradient(circle,#fff8e6 0,#e6d3a8 70%);border-radius:10px}
.card .nm{font-family:var(--f-display);font-size:15px;color:#2a1c08;line-height:1.1}
.card .meta{font-size:11px;font-weight:900;color:#6a4f25}
.card .price{font-size:14px;font-weight:900;display:flex;align-items:center;gap:4px;color:#2a1c08}
.card .cnt{position:absolute;top:6px;right:8px;font-size:11px;font-weight:900;background:#3b2a12;color:#fff;border-radius:6px;padding:1px 5px}
.card .num-badge{position:absolute;top:6px;left:8px;font-family:var(--f-display);font-size:16px;color:#fff;background:#2d67d6;border:2px solid var(--edge);border-radius:8px;padding:0 6px}
.armyrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cap{flex:1;min-width:160px;height:20px;background:#0b1220;border:2px solid var(--edge);border-radius:10px;overflow:hidden;position:relative}
.cap i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#8be35d,#3d9a1e)}
.cap span{position:relative;display:block;text-align:center;font-size:12px;line-height:16px}
.queue{display:flex;gap:6px;flex-wrap:wrap;min-height:40px;align-items:center;font-size:12px;color:var(--muted)}
.qi{pointer-events:auto;position:relative;width:46px;height:46px;border-radius:10px;border:2px solid var(--edge);background:#e9d9b4;overflow:hidden;cursor:pointer}
.qi img{width:100%;height:100%}
.qi b{position:absolute;right:2px;bottom:0;font-family:var(--f-display);font-size:13px;color:#fff}
.qi .p{position:absolute;left:0;bottom:0;height:4px;background:var(--ok)}
.note{font-size:12px;color:var(--muted);margin:10px 2px 0;font-weight:700}
#toast{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:20px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;max-width:88vw}
#toast.on{opacity:1}
#labels{position:absolute;inset:0;overflow:hidden}
.tl{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:900;text-align:center;white-space:nowrap}
.tl .pb{width:64px;height:7px;margin:2px auto 0;background:#0b1220;border:1.5px solid var(--edge);border-radius:4px;overflow:hidden}
.tl .pb i{display:block;height:100%;background:linear-gradient(#8be35d,#3d9a1e)}
.tl.name{font-family:var(--f-display);font-size:14px;font-weight:400}
/* bataille */
#bTop{position:absolute;left:calc(env(safe-area-inset-left,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;gap:4px;font-size:13px}
#bTop .loot{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:16px}
#bTimer{position:absolute;right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 8px);text-align:right}
#bTimer .t{font-family:var(--f-display);font-size:26px}
#bStars{position:absolute;right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;align-items:center;gap:4px}
.st{font-size:26px;color:#3a4357;-webkit-text-stroke:1.5px var(--edge)}
.st.on{color:var(--gold);animation:pop .5s}
@keyframes pop{0%{transform:scale(2.2)}100%{transform:scale(1)}}
#bPct{font-family:var(--f-display);font-size:22px;margin-left:6px}
#troopBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:6px;max-width:calc(100vw - 16px);overflow-x:auto;padding:4px}
.tb{pointer-events:auto;position:relative;width:64px;height:76px;flex:none;border-radius:12px;border:3px solid var(--edge);background:#e9d9b4;overflow:hidden;cursor:pointer;padding:0}
.tb img{width:100%;height:60px;object-fit:cover;display:block}
.tb b{position:absolute;left:3px;top:0;font-family:var(--f-display);font-size:15px;color:#fff;text-shadow:0 2px 0 #000}
.tb span{display:block;font-size:10px;color:#3b2a12;font-weight:900;line-height:14px}
.tb.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold);transform:translateY(-6px)}
.tb.empty{filter:grayscale(1) brightness(.7)}
#bBtns{position:absolute;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#bHint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);font-size:13px;background:rgba(10,18,32,.7);padding:5px 12px;border-radius:10px;white-space:nowrap}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:8px 0 4px}
.result .stars{font-size:54px;letter-spacing:6px}
.result .big-t{font-family:var(--f-display);font-size:34px}
.result .row{display:flex;gap:18px;justify-content:center;font-family:var(--f-display);font-size:20px;align-items:center;flex-wrap:wrap}
.info-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:6px 0 12px}
.info-grid span{color:var(--muted)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#5fb0e8,#9ad6f5);z-index:9;font-family:var(--f-display);font-size:30px;color:#fff;text-shadow:0 3px 0 var(--edge)}
@media (max-width:420px){.res{width:138px}.big{width:74px;height:74px;font-size:15px}.big .glyph{font-size:26px}.mid{width:62px;height:50px}}
@media (prefers-reduced-motion:reduce){.st.on{animation:none}.btn{transition:none}}
</style>

</div>

<script>
(function(){

    if(placing&&gp&&hitGhost(gp)){gest.type='drag';gest.off={x:placing.x+placing.s/2-HALF-gp.x,z:placing.z+placing.s/2-HALF-gp.z};}
    if(mode==='battle'){gest.hold=setTimeout(()=>{if(gest&&gest.type==='pending'){gest.type='deploy';gest.int=setInterval(()=>{const p=[...ptrs.values()][0];if(p)deployAt(p.x,p.y);},110);deployAt(gest.sx,gest.sy);}},260);}}
  else if(ptrs.size===2){endGest();const [a,b]=[...ptrs.values()];gest={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),a0:Math.atan2(b.y-a.y,b.x-a.x),dist0:cam.dist,az0:cam.az};}});

  if(gest.type==='pan'&&gest.anchor){const cur=groundAt(p.x,p.y);if(cur){cam.target.x=clamp(cam.target.x+gest.anchor.x-cur.x,-30,30);cam.target.z=clamp(cam.target.z+gest.anchor.z-cur.z,-30,30);updateCamera();}}
  else if(gest.type==='drag'){const cur=groundAt(p.x,p.y);if(cur)moveGhostTo(cur.x+gest.off.x,cur.z+gest.off.z);}
  else if(gest.type==='pinch'&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);cam.dist=clamp(gest.dist0*gest.d0/Math.max(d,1),16,70);const an=Math.atan2(b.y-a.y,b.x-a.x);cam.az=gest.az0-(an-gest.a0);updateCamera();}});

function costOf(type,lvlIdx){if(type==='hut')return HUT_GEMS[Math.min(count('hut')+1,HUT_GEMS.length-1)];return DEF[type].cost[lvlIdx];}
function center(b){const s=DEF[b.type].size;return {x:b.x+s/2-HALF,z:b.z+s/2-HALF};}

function buildMesh(b){const old=VM.get(b.id);if(old)world.remove(old);const g=makeModel(b.type,b.lvl);const c=center(b);g.position.set(c.x,0,c.z);g.userData.bid=b.id;if(b.type!=='wall')g.rotation.y=0;
  if(isUp(b)){scaffold(g,DEF[b.type].size);if(b.type!=='wall'){const w=makeTroop('builder');const s=DEF[b.type].size;w.position.set(s/2+.15,0,s/2-.3);w.rotation.y=-Math.PI/2;w.userData.hammer=true;g.add(w);}}
  if(b.upTo===1&&isUp(b)){g.children.forEach(ch=>{if(ch.name!=='scaff'&&!ch.userData.hammer)ch.scale.y=.35;});}
  world.add(g);VM.set(b.id,g);return g;}
function buildVillage(){world.clear();VM.clear();S.buildings.forEach(buildMesh);}

function occupied(x,z,s,ignore){if(x<1||z<1||x+s>GRID-1||z+s>GRID-1)return true;for(const b of S.buildings){if(b===ignore||b.id===(ignore&&ignore.id))continue;const bs=DEF[b.type].size;if(x<b.x+bs&&x+s>b.x&&z<b.z+bs&&z+s>b.z)return true;}return false;}
function freeSpot(s){const c=Math.floor(GRID/2-s/2);for(let r=0;r<GRID;r++)for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){if(Math.max(Math.abs(dx),Math.abs(dz))!==r)continue;const x=c+dx,z=c+dz;if(!occupied(x,z,s))return {x,z};}return null;}

/* sélection et panneau */
function select(b){selected=b;placing=null;refreshSel();}
function refreshSel(){const el=$('#sel');if(!selected||mode!=='village'||placing){el.hidden=true;selRing.visible=false;$('#vHud').hidden=mode!=='village'||!!placing;return;}
  const b=selected,d=DEF[b.type],s=d.size;el.hidden=false;$('#cornerL').hidden=$('#cornerR').hidden=true;
  const c=center(b);selRing.visible=true;selRing.position.set(c.x,.05,c.z);selRing.scale.setScalar(s*.75+.2);
  $('#selName').textContent=d.name+(d.maxLvl===1?'':' (niv. '+b.lvl+')');
  const info=[];info.push('PV '+fmt(d.hp[b.lvl-1]));if(d.prod)info.push(fmt(d.prod[b.lvl-1]*3600)+'/h · '+fmt(b.stored)+'/'+fmt(d.cap[b.lvl-1]));if(d.store)info.push('Capacité '+fmt(d.store[b.lvl-1]));if(d.army)info.push('Troupes '+d.army[b.lvl-1]);if(d.dmg)info.push('Dégâts '+(d.dmg[b.lvl-1]/d.rate).toFixed(0)+'/s · portée '+d.range);
  $('#selInfo').textContent=info.join('  ·  ');
  const btns=[];const ml=maxLvl(b.type);
  if(isUp(b)){const rem=(b.upEnd-now())/1000,gem=Math.ceil(rem/15)+1;btns.push(`<button class="btn gemb" data-a="finish">Terminer<small>${gem} <span class="ico gem sm"></span></small></button>`);}
  else if(b.lvl<ml){const nc=d.cost[b.lvl],need=b.type==='townhall'?true:b.lvl<thLvl();btns.push(`<button class="btn ok" data-a="up" ${need?'':'disabled'}>Améliorer<small>${need?fmt(nc)+' <span class="ico '+(d.res==='gold'?'coin':'drop')+' sm"></span>':'Donjon niv. '+(b.lvl+1)}</small></button>`);}
  if(d.prod&&b.stored>=1)btns.push(`<button class="btn warm" data-a="collect">Récolter<small>${fmt(b.stored)}</small></button>`);
  if(b.type==='barracks'||b.type==='camp')btns.push(`<button class="btn" data-a="train">Entraîner<small>troupes</small></button>`);
  btns.push(`<button class="btn" data-a="info">Infos<small>&nbsp;</small></button>`);
  btns.push(`<button class="btn" data-a="move">Déplacer<small>&nbsp;</small></button>`);
  $('#selBtns').innerHTML=btns.join('');}
$('#selBtns').addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a||a.disabled||!selected)return;const b=selected,d=DEF[b.type];audioInit();
  if(a.dataset.a==='up'){const c=d.cost[b.lvl];if(S.res[d.res]<c)return toast("Pas assez "+(d.res==='gold'?"d'or":'de mana'));if(busy()>=huts())return toast('Tous les ouvriers sont occupés');S.res[d.res]-=c;b.upEnd=now()+d.time[b.lvl]*1000;b.upTo=b.lvl+1;if(d.time[b.lvl]===0)finishUp(b);else{buildMesh(b);snd('build');}save();}
  if(a.dataset.a==='finish'){const g=Math.ceil((b.upEnd-now())/15000)+1;if(S.res.gems<g)return toast('Pas assez de gemmes');S.res.gems-=g;finishUp(b);}
  if(a.dataset.a==='collect')collect(b);
  if(a.dataset.a==='train')openArmy();
  if(a.dataset.a==='info')openInfo(b);
  if(a.dataset.a==='move')startPlace({type:b.type,existing:b});
  refreshSel();refreshHud();});
function finishUp(b){const wasNew=b.upTo===1;b.lvl=b.upTo;b.upEnd=0;b.upTo=0;gainXp(wasNew?5:b.lvl*8);buildMesh(b);const c=center(b);fx('dust',new THREE.Vector3(c.x,.3,c.z),12,{speed:2,size:.35,grav:-1,life:.9,grow:1});snd('win');
  toast(DEF[b.type].name+(wasNew?' construit !':' niveau '+b.lvl+' !'));save();if(selected===b)refreshSel();}
function collect(b){const d=DEF[b.type],r=b.type==='goldmine'?'gold':'mana';const got=addRes(r,b.stored);if(got<1&&b.stored>=1){toast('Stockage plein ! Améliore tes '+(r==='gold'?'coffres':'réservoirs'));return;}b.stored-=got;const c=center(b);
  fx(r==='gold'?'gold':'mana',new THREE.Vector3(c.x,1.5,c.z),10,{speed:1.8,size:.14,life:.8});snd('coin');floatText('+'+fmt(got),c.x,2.5,c.z,r==='gold'?'#ffcc33':'#e3a3ff');save();refreshHud();}
function openInfo(b){const d=DEF[b.type];let h=`<div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap"><img src="${THUMB[b.type]||''}" alt="" style="width:130px;max-width:100%;border-radius:12px;background:#e6d3a8"><div style="flex:1;min-width:180px"><p style="margin:0 0 8px;font-weight:700">${d.desc}</p><div class="info-grid">`;
  h+=`<span>Niveau</span><b>${b.lvl} / ${maxLvl(b.type)}</b><span>Points de vie</span><b>${fmt(d.hp[b.lvl-1])}</b>`;
  if(d.prod)h+=`<span>Production</span><b>${fmt(d.prod[b.lvl-1]*3600)} / h</b><span>Réserve</span><b>${fmt(d.cap[b.lvl-1])}</b>`;
  if(d.store)h+=`<span>Capacité</span><b>${fmt(d.store[b.lvl-1])}</b>`;if(d.army)h+=`<span>Place troupes</span><b>${d.army[b.lvl-1]}</b>`;
  if(d.dmg)h+=`<span>Dégâts / s</span><b>${(d.dmg[b.lvl-1]/d.rate).toFixed(1)}</b><span>Portée</span><b>${d.minRange?d.minRange+' – ':''}${d.range} cases</b>`;
  if(b.lvl<maxLvl(b.type))h+=`<span>Prochain niveau</span><b>${fmt(d.cost[b.lvl])} ${d.res==='gold'?'or':'mana'} · ${fmtT(d.time[b.lvl])}</b>`;
  h+='</div></div></div>';openModal(d.name,h);}

/* placement */
function startPlace(o){const s=DEF[o.type].size;closeModal();selected=null;let x,z;
  if(o.existing){x=o.existing.x;z=o.existing.z;}else{const near=o.near;if(near&&!occupied(near.x,near.z,s)){x=near.x;z=near.z;}else{const c=groundAt(innerWidth/2,innerHeight/2)||new THREE.Vector3();const cc={x:Math.round(c.x+HALF-s/2),z:Math.round(c.z+HALF-s/2)};if(!occupied(cc.x,cc.z,s)){x=cc.x;z=cc.z;}else{const f=freeSpot(s);if(!f)return toast('Plus de place libre');x=f.x;z=f.z;}}}
  let mesh;if(o.existing)mesh=VM.get(o.existing.id);else{mesh=makeModel(o.type,1);world.add(mesh);}
  placing={type:o.type,s,x,z,mesh,existing:o.existing,ox:x,oz:z};gridOverlay.visible=true;ghostPlane.visible=true;ghostPlane.scale.set(s,s,1);moveGhost(x,z);
  $('#placeBar').hidden=false;$('#placeHint').hidden=false;refreshSel();}
function moveGhostTo(wx,wz){if(!placing)return;moveGhost(Math.round(wx+HALF-placing.s/2),Math.round(wz+HALF-placing.s/2));}
function moveGhost(x,z){const p=placing;p.x=clamp(x,1,GRID-1-p.s);p.z=clamp(z,1,GRID-1-p.s);const wx=p.x+p.s/2-HALF,wz=p.z+p.s/2-HALF;p.mesh.position.set(wx,.15,wz);ghostPlane.position.set(wx,.04,wz);
  p.ok=!occupied(p.x,p.z,p.s,p.existing);ghostPlane.material=p.ok?M.ghostOk:M.ghostBad;$('#placeOk').disabled=!p.ok;}
function hitGhost(gp){const p=placing,wx=p.x+p.s/2-HALF,wz=p.z+p.s/2-HALF;return Math.abs(gp.x-wx)<p.s/2+.6&&Math.abs(gp.z-wz)<p.s/2+.6;}
function endPlace(){if(!placing)return;gridOverlay.visible=false;ghostPlane.visible=false;$('#placeBar').hidden=true;$('#placeHint').hidden=true;placing=null;refreshSel();}
$('#placeNo').onclick=()=>{const p=placing;if(!p)return;if(p.existing){const c=center(p.existing);p.mesh.position.set(c.x,0,c.z);}else world.remove(p.mesh);endPlace();};
$('#placeOk').onclick=()=>{const p=placing;if(!p||!p.ok)return;
  if(p.existing){p.existing.x=p.x;p.existing.z=p.z;p.mesh.position.y=0;const b=p.existing;endPlace();select(b);save();return;}
  const d=DEF[p.type],c=costOf(p.type,0),r=d.res;if(S.res[r]<c){toast('Pas assez '+(r==='gold'?"d'or":r==='mana'?'de mana':'de gemmes'));return;}
  if(d.time[0]>0&&busy()>=huts()){toast('Tous les ouvriers sont occupés');return;}
  S.res[r]-=c;const b={id:S.nextId++,type:p.type,lvl:1,x:p.x,z:p.z,stored:0,upEnd:0,upTo:0};if(d.time[0]>0){b.upEnd=now()+d.time[0]*1000;b.upTo=1;}
  S.buildings.push(b);world.remove(p.mesh);buildMesh(b);const cc=center(b);fx('dust',new THREE.Vector3(cc.x,.2,cc.z),10,{speed:1.6,size:.3,grav:-1,life:.8,grow:1});snd('build');
  const wasWall=p.type==='wall',dx=p.x-p.ox,dz=p.z-p.oz;endPlace();gainXp(wasWall?0:3);save();refreshHud();
  if(wasWall&&count('wall')<LIMIT.wall[thLvl()-1]&&S.res.gold>=d.cost[0]){let nx=b.x+1,nz=b.z;if(Math.abs(dz)>Math.abs(dx)){nx=b.x;nz=b.z+Math.sign(dz||1);}else if(dx<0)nx=b.x-1;startPlace({type:'wall',near:{x:nx,z:nz}});placing.ox=b.x;placing.oz=b.z;}};

/* tap */
function onTap(cx,cy){if(mode==='battle'){deployAt(cx,cy);return;}
  if(placing){const gp=groundAt(cx,cy);if(gp)moveGhostTo(gp.x,gp.z);return;}
  ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const hits=ray.intersectObjects(world.children,true);
  let b=null;for(const h of hits){let o=h.object;while(o&&o.userData.bid==null)o=o.parent;if(o){b=S.buildings.find(x=>x.id===o.userData.bid);break;}}
  if(!b){const gp=groundAt(cx,cy);if(gp){const c={x:Math.floor(gp.x+HALF),z:Math.floor(gp.z+HALF)};b=S.buildings.find(q=>{const s=DEF[q.type].size;return c.x>=q.x&&c.x<q.x+s&&c.z>=q.z&&c.z<q.z+s;});}}
  if(b){if(DEF[b.type].prod&&b.stored>=Math.max(5,DEF[b.type].cap[b.lvl-1]*.01)&&!isUp(b)){collect(b);}const m=VM.get(b.id);if(m){m.userData.bounce=.25;}select(b);snd('pop');}else{selected=null;refreshSel();}}

/* boutique */
let shopTab='res';
function openShop(){const tabs=[['res','Ressources'],['def','Défense'],['army','Armée']];const th=thLvl();
  let h='<div class="tabs">'+tabs.map(([k,n])=>`<button class="btn ${shopTab===k?'on':''}" data-tab="${k}">${n}</button>`).join('')+'</div><div class="cards">';
  Object.keys(DEF).filter(t=>DEF[t].cat===shopTab).forEach(t=>{const d=DEF[t],mx=LIMIT[t][th-1],n=count(t),c=costOf(t,0);const unlockAt=LIMIT[t].findIndex(v=>v>n)+1;const off=n>=mx;
    const ico=d.res==='gold'?'coin':d.res==='mana'?'drop':'gem';
    h+=`<div class="card ${off?'off':''}" data-buy="${t}" role="button" tabindex="0"><span class="cnt">${n}/${mx}</span><img src="${THUMB[t]||''}" alt=""><div class="nm">${d.name}</div>
    <div class="meta">${off?(unlockAt>0?'Donjon niv. '+unlockAt:'Maximum atteint'):(d.time[0]?'Durée '+fmtT(d.time[0]):'Instantané')}</div><div class="price">${c?fmt(c):'Gratuit'} <span class="ico ${ico} sm"></span></div></div>`;});
  h+='</div><p class="note">Astuce : fais glisser un doigt pour déplacer la vue, pince pour zoomer et tourner.</p>';openModal('Boutique',h);}
$('#mBody').addEventListener('click',e=>{const tb=e.target.closest('[data-tab]');if(tb){shopTab=tb.dataset.tab;openShop();return;}
  const by=e.target.closest('[data-buy]');if(by){if(by.classList.contains('off'))return;const t=by.dataset.buy,d=DEF[t],c=costOf(t,0);if(S.res[d.res]<c)return toast('Pas assez '+(d.res==='gold'?"d'or":d.res==='mana'?'de mana':'de gemmes'));if(d.time[0]>0&&busy()>=huts())return toast('Tous les ouvriers sont occupés');startPlace({type:t});return;}
  const tr=e.target.closest('[data-train]');if(tr){train(tr.dataset.train);return;}
  const uq=e.target.closest('[data-unq]');if(uq){const i=+uq.dataset.unq;const k=S.queue[i];if(k){S.queue.splice(i,1);S.res.mana+=TROOPS[k].cost;if(i===0)S.trainT=0;openArmy();refreshHud();}return;}
  const fq=e.target.closest('[data-fastq]');if(fq){const g=Math.ceil(S.queue.reduce((a,k)=>a+TROOPS[k].time,0)/10);if(S.res.gems<g)return toast('Pas assez de gemmes');S.res.gems-=g;let ok=0;while(S.queue.length&&armySpace()+TROOPS[S.queue[0]].space<=armyCap()){const k=S.queue.shift();S.army[k]=(S.army[k]||0)+1;ok++;}S.trainT=0;openArmy();refreshHud();save();return;}
  const ab=e.target.closest('[data-act]');if(ab){if(ab.dataset.act==='home'){closeModal();endBattleReturn();}if(ab.dataset.act==='go'){closeModal();startBattle();}}});

/* armée */
function train(k){const t=TROOPS[k];if(barracksLvl()<t.unlock)return toast('Caserne niv. '+t.unlock+' requise');if(armySpace()+queueSpace()+t.space>armyCap())return toast("Camp plein : améliore ou construis un camp");if(S.res.mana<t.cost)return toast('Pas assez de mana');
  S.res.mana-=t.cost;S.queue.push(k);snd('pop');openArmy();refreshHud();save();}
function openArmy(){const capN=armyCap(),sp=armySpace(),qs=queueSpace(),bl=barracksLvl();
  let h=`<div class="armyrow"><div style="font-family:var(--f-display);font-size:16px">Armée</div><div class="cap"><i style="width:${capN?Math.min(100,sp/capN*100):0}%"></i><span class="out">${sp} / ${capN}${qs?' (+'+qs+' en formation)':''}</span></div></div>`;
  h+='<div class="queue">'+(S.queue.length?S.queue.map((k,i)=>`<div class="qi" data-unq="${i}" title="Retirer"><img src="${THUMB['t_'+k]||''}" alt="">${i===0?`<div class="p" style="width:${S.trainT/TROOPS[k].time*100}%"></div>`:''}</div>`).join('')+`<button class="btn gemb" data-fastq="1" style="margin-left:auto">Terminer ${Math.ceil(S.queue.reduce((a,k)=>a+TROOPS[k].time,0)/10)} <span class="ico gem sm"></span></button>`:'File de formation vide. Touche une troupe pour la former.')+'</div>';
  h+='<div class="cards" style="margin-top:10px">';Object.keys(TROOPS).forEach(k=>{const t=TROOPS[k],lock=bl<t.unlock;h+=`<div class="card ${lock?'off':''}" data-train="${k}" role="button" tabindex="0">${S.army[k]?`<span class="num-badge">x${S.army[k]}</span>`:''}<span class="cnt">${t.space} pl.</span><img src="${THUMB['t_'+k]||''}" alt=""><div class="nm">${t.name}</div><div class="meta">${lock?'Caserne niv. '+t.unlock:'PV '+t.hp+' · '+fmtT(t.time)}</div><div class="price">${t.cost} <span class="ico drop sm"></span></div></div>`;});
  h+='</div><p class="note">Touche une troupe dans la file pour l\'annuler et récupérer le mana.</p>';openModal('Entraîner des troupes',h);armyOpen=true;}
let armyOpen=false;

function closeModal(){$('#modal').hidden=true;armyOpen=false;}
$('#mClose').onclick=()=>{if(resultOpen){closeModal();endBattleReturn();}else closeModal();};

$('#btnShop').onclick=()=>{audioInit();openShop();};$('#btnArmy').onclick=()=>{audioInit();openArmy();};

/* étiquettes HTML */
function floatText(txt,x,y,z,color){const el=document.createElement('div');el.className='tl out';el.style.color=color;el.style.fontFamily='var(--f-display)';el.style.fontSize='18px';el.textContent=txt;$('#labels').appendChild(el);const p=new THREE.Vector3(x,y,z);const t0=performance.now();
  (function f(){const k=(performance.now()-t0)/1000;if(k>1.1){el.remove();return;}tmpV.set(p.x,p.y+k*1.2,p.z).project(camera);el.style.left=((tmpV.x+1)/2*innerWidth)+'px';el.style.top=((1-tmpV.y)/2*innerHeight)+'px';el.style.opacity=String(1-k/1.1);requestAnimationFrame(f);})();}
function updLabels(){const seen=new Set();if(mode==='village'){S.buildings.forEach(b=>{if(!isUp(b)||b.type==='wall')return;seen.add(b.id);let el=labels.get(b.id);if(!el){el=document.createElement('div');el.className='tl out';el.innerHTML='<span></span><div class="pb"><i></i></div>';$('#labels').appendChild(el);labels.set(b.id,el);}
  const d=DEF[b.type],tot=d.time[b.upTo-1]*1000||1,rem=b.upEnd-now();const c=center(b);tmpV.set(c.x,d.size*.9+1,c.z).project(camera);el.style.left=((tmpV.x+1)/2*innerWidth)+'px';el.style.top=((1-tmpV.y)/2*innerHeight)+'px';el.firstChild.textContent=fmtT(rem/1000);el.lastChild.firstChild.style.width=(100-rem/tot*100)+'%';});}
  labels.forEach((el,id)=>{if(!seen.has(id)){el.remove();labels.delete(id);}});}

/* HUD */
function refreshHud(){const gc=cap('gold'),mc=cap('mana');$('#goldTxt').textContent=fmt(S.res.gold);$('#manaTxt').textContent=fmt(S.res.mana);$('#gemsTxt').textContent=fmt(S.res.gems);
  $('#goldCap').textContent='Max '+fmt(gc);$('#manaCap').textContent='Max '+fmt(mc);$('#goldFill').style.width=(S.res.gold/gc*100)+'%';$('#manaFill').style.width=(S.res.mana/mc*100)+'%';
  $('#builders').textContent=(huts()-busy())+'/'+huts();$('#trophies').textContent=fmt(S.trophies);const x=xpLevel();$('#xpLvl').textContent=x.l;$('#xpFill').style.width=(x.f*100)+'%';}

/* simulation village */
let villageAcc=0,saveAcc=0;
function tickVillage(dt){const t=now();
  S.buildings.forEach(b=>{if(isUp(b)&&t>=b.upEnd)finishUp(b);const d=DEF[b.type];if(d.prod&&!isUp(b)){b.stored=Math.min(d.cap[b.lvl-1],b.stored+d.prod[b.lvl-1]*dt);}});
  if(S.queue.length){const k=S.queue[0];if(armySpace()+TROOPS[k].space<=armyCap()){S.trainT+=dt;if(S.trainT>=TROOPS[k].time){S.trainT=0;S.queue.shift();S.army[k]=(S.army[k]||0)+1;if(armyOpen)openArmy();}}}
  saveAcc+=dt;if(saveAcc>4){saveAcc=0;save();}villageAcc+=dt;if(villageAcc>.5){villageAcc=0;refreshHud();if(selected)refreshSelLite();if(armyOpen&&S.queue.length){const p=document.querySelector('.qi .p');if(p)p.style.width=(S.trainT/TROOPS[S.queue[0]].time*100)+'%';}}}
function refreshSelLite(){const b=selected;if(!b)return;const d=DEF[b.type];if(d.prod||isUp(b))refreshSel();}
function offline(){const el=Math.min((now()-(S.last||now()))/1000,7*86400);if(el<=0)return;S.buildings.forEach(b=>{const d=DEF[b.type];if(d.prod&&!isUp(b))b.stored=Math.min(d.cap[b.lvl-1],b.stored+d.prod[b.lvl-1]*el);});
  let left=el;while(S.queue.length&&left>0){const k=S.queue[0];if(armySpace()+TROOPS[k].space>armyCap())break;const need=TROOPS[k].time-S.trainT;if(left>=need){left-=need;S.trainT=0;S.queue.shift();S.army[k]=(S.army[k]||0)+1;}else{S.trainT+=left;left=0;}}}

/* ================= BATAILLE ================= */
let BT=null,resultOpen=false;const bWorld=new THREE.Group();scene.add(bWorld);
const BAR={bg:new THREE.SpriteMaterial({color:0x10141c,depthTest:false}),red:new THREE.SpriteMaterial({color:0xe2483d,depthTest:false}),green:new THREE.SpriteMaterial({color:0x6ee04a,depthTest:false}),blue:new THREE.SpriteMaterial({color:0x4fa3ff,depthTest:false})};
function makeBar(w,mat){const bg=new THREE.Sprite(BAR.bg),fg=new THREE.Sprite(mat);bg.center.set(0,.5);fg.center.set(0,.5);bg.scale.set(w+.08,.2,1);fg.scale.set(w,.13,1);bg.renderOrder=998;fg.renderOrder=999;bg.visible=fg.visible=false;bWorld.add(bg,fg);return {bg,fg,w};}
const camRight=new THREE.Vector3();
function placeBar(bar,x,y,z,f,show){bar.bg.visible=bar.fg.visible=show;if(!show)return;bar.bg.position.set(x-camRight.x*(bar.w/2+.04),y,z-camRight.z*(bar.w/2+.04));bar.fg.position.set(x-camRight.x*bar.w/2,y,z-camRight.z*bar.w/2);bar.fg.scale.x=Math.max(.001,bar.w*f);bar.fg.position.y=y;}

function genBase(L){const list=[];const occ=new Uint8Array(GRID*GRID);
  const free=(x,z,s,p)=>{if(x-p<2||z-p<2||x+s+p>GRID-2||z+s+p>GRID-2)return false;for(let i=x-p;i<x+s+p;i++)for(let j=z-p;j<z+s+p;j++)if(occ[j*GRID+i])return false;return true;};
  const put=(type,x,z,lvl)=>{const s=DEF[type].size;for(let i=x;i<x+s;i++)for(let j=z;j<z+s;j++)occ[j*GRID+i]=1;list.push({type,lvl:clamp(lvl,1,maxLvl(type)),x,z});};
  const lv=()=>clamp(L-rint(0,1),1,5);const c=HALF-2;put('townhall',c,c,L);
  const inner=[];DEFENSES.forEach(t=>{for(let i=0;i<LIMIT[t][L-1];i++)inner.push(t);});['goldstore','manastore'].forEach(t=>{for(let i=0;i<LIMIT[t][L-1];i++)inner.push(t);});inner.sort(()=>Math.random()-.5);
  inner.forEach(t=>{const s=DEF[t].size;for(let k=0;k<400;k++){const r=4+k/40,a=Math.random()*6.28;const x=Math.round(HALF+Math.cos(a)*r-s/2),z=Math.round(HALF+Math.sin(a)*r-s/2);if(free(x,z,s,1)){put(t,x,z,lv());break;}}});
  let x0=99,z0=99,x1=0,z1=0;list.forEach(b=>{const s=DEF[b.type].size;x0=Math.min(x0,b.x);z0=Math.min(z0,b.z);x1=Math.max(x1,b.x+s-1);z1=Math.max(z1,b.z+s-1);});x0-=2;z0-=2;x1+=2;z1+=2;
  const wl=clamp(L-rint(0,1),1,5);for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++)if((x===x0||x===x1||z===z0||z===z1)&&!occ[z*GRID+x])put('wall',x,z,wl);
  if(L>=2){const mx=Math.round((x0+x1)/2);for(let z=z0;z<=z1;z++)if(!occ[z*GRID+mx]&&Math.random()<.85)put('wall',mx,z,wl);}
  const outer=[];['goldmine','manapump','barracks','camp','hut'].forEach(t=>{const n=t==='hut'?rint(2,4):LIMIT[t][L-1];for(let i=0;i<n;i++)outer.push(t);});
  outer.forEach(t=>{const s=DEF[t].size;for(let k=0;k<500;k++){const x=rint(2,GRID-2-s),z=rint(2,GRID-2-s);if(x+s>=x0-1&&x<=x1+1&&z+s>=z0-1&&z<=z1+1)continue;const d=Math.hypot(x-HALF,z-HALF);if(d>15+k/60)continue;if(free(x,z,s,1)){put(t,x,z,lv());break;}}});
  return list;}

function startBattle(){closeModal();selected=null;endPlace();mode='battle';resultOpen=false;world.visible=false;bWorld.clear();selRing.visible=false;FX.forEach(p=>p.m.removeFromParent());FX.length=0;
  const L=clamp(thLvl()+(Math.random()<.35?1:0)-(Math.random()<.3?1:0),1,5);const list=genBase(L);
  const tg=[800,2500,6000,15000,35000][L-1]*rnd(.7,1.3),tm=[800,2500,6000,15000,35000][L-1]*rnd(.7,1.3);
  const bs=list.map((o,i)=>{const d=DEF[o.type],s=d.size;const g=makeModel(o.type,o.lvl);const cx=o.x+s/2-HALF,cz=o.z+s/2-HALF;g.position.set(cx,0,cz);bWorld.add(g);
    const hp=d.hp[o.lvl-1];return {i,type:o.type,lvl:o.lvl,x:o.x,z:o.z,s,cx,cz,hp,maxhp:hp,dead:false,g,cd:rnd(0,1),turret:g.userData.turret,isDef:DEFENSES.includes(o.type),bar:makeBar(Math.min(1.8,s*.5+.3),BAR.green),lg:0,lm:0,tgt:null};});
  const share=(r,types,frac)=>{const arr=bs.filter(b=>types.includes(b.type));const tot=arr.reduce((a,b)=>a+DEF[b.type].size,0)||1;arr.forEach(b=>b[r]+=(r==='lg'?tg:tm)*frac*DEF[b.type].size/tot);};
  share('lg',['goldstore'],.55);share('lg',['goldmine'],.3);share('lg',['townhall'],.15);share('lm',['manastore'],.55);share('lm',['manapump'],.3);share('lm',['townhall'],.15);
  const occ=new Int32Array(GRID*GRID);bs.forEach(b=>{for(let i=b.x;i<b.x+b.s;i++)for(let j=b.z;j<b.z+b.s;j++)occ[j*GRID+i]=b.i+1;});
  const army={};for(const k in S.army)if(S.army[k]>0)army[k]=S.army[k];
  BT={L,bs,occ,troops:[],proj:[],army,deployed:{},time:180,started:false,over:false,lootG:0,lootM:0,totG:tg,totM:tm,stars:0,pct:0,thDead:false,sel:Object.keys(army)[0]||null,forbid:null,fTime:0,nonWall:bs.filter(b=>b.type!=='wall').length,destroyed:0};
  buildForbid();cam.target.set(0,0,2);cam.dist=46;updateCamera();
  $('#vHud').hidden=true;$('#sel').hidden=true;$('#bHud').hidden=false;$('#bLvl').textContent=L;$('#bNext').hidden=false;$('#bNextCost').innerHTML=fmt(L*60)+' <span class="ico coin sm"></span>';$('#bHint').hidden=false;
  ['s1','s2','s3'].forEach(id=>$('#'+id).classList.remove('on'));renderTroopBar();updBattleHud();showForbid(2.5);}
function buildForbid(){const f=new Uint8Array(GRID*GRID);BT.bs.forEach(b=>{if(b.dead)return;for(let i=b.x-1;i<b.x+b.s+1;i++)for(let j=b.z-1;j<b.z+b.s+1;j++)if(i>=0&&j>=0&&i<GRID&&j<GRID)f[j*GRID+i]=1;});BT.forbid=f;
  if(BT.fMesh)bWorld.remove(BT.fMesh);let n=0;for(let i=0;i<f.length;i++)n+=f[i];const im=new THREE.InstancedMesh(memo('fp',()=>{const g=new THREE.PlaneGeometry(1,1);g.rotateX(-Math.PI/2);return g;}),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}),n);
  const m=new THREE.Matrix4();let k=0;for(let j=0;j<GRID;j++)for(let i=0;i<GRID;i++)if(f[j*GRID+i]){m.makeTranslation(i-HALF+.5,.03,j-HALF+.5);im.setMatrixAt(k++,m);}bWorld.add(im);BT.fMesh=im;}
function showForbid(t){BT.fTime=t;}
function renderTroopBar(){const el=$('#troopBar');el.innerHTML=Object.keys(BT.army).map(k=>`<button class="tb ${BT.sel===k?'on':''} ${BT.army[k]?'':'empty'}" data-tr="${k}"><img src="${THUMB['t_'+k]||''}" alt=""><b>x${BT.army[k]}</b><span>${TROOPS[k].name}</span></button>`).join('');}
$('#troopBar').addEventListener('click',e=>{const b=e.target.closest('[data-tr]');if(!b)return;BT.sel=b.dataset.tr;renderTroopBar();});
$('#bNext').onclick=()=>{if(!BT||BT.started)return;const c=BT.L*60;if(S.res.gold<c)return toast("Pas assez d'or");S.res.gold-=c;bWorld.clear();startBattle();};
$('#bEnd').onclick=()=>{if(!BT||BT.over)return;if(!BT.started){endBattleReturn();return;}finishBattle();};

function deployAt(cx,cy){if(!BT||BT.over)return;const k=BT.sel;if(!k||!BT.army[k]){const other=Object.keys(BT.army).find(q=>BT.army[q]>0);if(!other){toast('Plus de troupes');return;}BT.sel=other;renderTroopBar();return;}
  const gp=groundAt(cx,cy);if(!gp)return;const ci=Math.floor(gp.x+HALF),cj=Math.floor(gp.z+HALF);if(ci<0||cj<0||ci>=GRID||cj>=GRID){toast('Déploie dans la zone de combat');return;}
  if(BT.forbid[cj*GRID+ci]){showForbid(1.2);return;}
  BT.army[k]--;BT.deployed[k]=(BT.deployed[k]||0)+1;if(!BT.started){BT.started=true;$('#bNext').hidden=true;$('#bHint').hidden=true;}
  const T=TROOPS[k],mult=1+.12*(barracksLvl()-1);const g=makeTroop(k);g.position.set(gp.x,0,gp.z);bWorld.add(g);
  const hp=T.hp*mult;BT.troops.push({k,T,x:gp.x,z:gp.z,hp,maxhp:hp,dmg:T.dmg*mult,g,cd:.3,target:null,wall:null,path:null,pi:0,repath:false,dead:false,ox:rnd(-.25,.25),oz:rnd(-.25,.25),anim:'idle',bar:makeBar(.6,BAR.blue),at:Math.random()*5});
  fx('dust',new THREE.Vector3(gp.x,.1,gp.z),4,{speed:1,size:.18,grav:-.5,life:.5,grow:1.5});snd('pop');renderTroopBar();}

/* A* */
const AS={g:new Float32Array(GRID*GRID),from:new Int32Array(GRID*GRID),stamp:new Int32Array(GRID*GRID),closed:new Int32Array(GRID*GRID),gen:0};
function astar(sx,sz,goal,wallCost){const N=GRID,occ=BT.occ,bs=BT.bs;AS.gen++;const gen=AS.gen;const start=sz*N+sx;
  const tx=goal.x+goal.s/2,tz=goal.z+goal.s/2;const h=(i,j)=>{const dx=Math.abs(i+.5-tx),dz=Math.abs(j+.5-tz);return Math.max(dx,dz)+.414*Math.min(dx,dz);};
  const cost=(idx)=>{const o=occ[idx];if(!o)return 1;const b=bs[o-1];if(b===goal)return 1;if(b.type==='wall')return wallCost;return Infinity;};
  const heap=[];const push=(f,i)=>{heap.push([f,i]);let c=heap.length-1;while(c>0){const p=(c-1)>>1;if(heap[p][0]<=heap[c][0])break;[heap[p],heap[c]]=[heap[c],heap[p]];c=p;}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let c=0;for(;;){const l=c*2+1,r=l+1;let m=c;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===c)break;[heap[m],heap[c]]=[heap[c],heap[m]];c=m;}}return top;};
  AS.g[start]=0;AS.stamp[start]=gen;AS.from[start]=-1;push(h(sx,sz),start);let it=0,found=-1;
  while(heap.length&&it++<5000){const [,cur]=pop();if(AS.closed[cur]===gen)continue;AS.closed[cur]=gen;if(occ[cur]===goal.i+1){found=cur;break;}const ci=cur%N,cj=(cur/N)|0;
    for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){if(!di&&!dj)continue;const ni=ci+di,nj=cj+dj;if(ni<0||nj<0||ni>=N||nj>=N)continue;const nx=nj*N+ni;let c=cost(nx);if(c===Infinity)continue;
      if(di&&dj){const a=cost(cj*N+ni),b=cost(nj*N+ci);if(a!==1||b!==1)continue;c*=1.414;}const ng=AS.g[cur]+c;if(AS.stamp[nx]!==gen||ng<AS.g[nx]){AS.stamp[nx]=gen;AS.g[nx]=ng;AS.from[nx]=cur;push(ng+h(ni,nj),nx);}}}
  if(found<0)return null;const path=[];let c=found;while(c!==-1&&c!==start){path.push(c);c=AS.from[c];}return path.reverse();}

function rectDist(x,z,b){const dx=Math.max(Math.abs(x-b.cx)-b.s/2,0),dz=Math.max(Math.abs(z-b.cz)-b.s/2,0);return Math.hypot(dx,dz);}
function chooseTarget(t){const alive=BT.bs.filter(b=>!b.dead&&b.type!=='wall');let pool=alive;
  if(t.T.pref==='defense'){const d=alive.filter(b=>b.isDef);if(d.length)pool=d;}
  if(t.T.pref==='wall'){const w=BT.bs.filter(b=>!b.dead&&b.type==='wall');if(w.length)pool=w;}
  let best=null,bd=1e9;pool.forEach(b=>{const d=rectDist(t.x,t.z,b);if(d<bd){bd=d;best=b;}});return best;}
function damageB(b,d){if(b.dead)return;const f=Math.min(d,b.hp)/b.maxhp;b.hp-=d;if(b.lg){const g=b.lg*f;BT.lootG+=g;}if(b.lm){BT.lootM+=b.lm*f;}if(b.hp<=0)destroyB(b);}
function destroyB(b){b.dead=true;b.hp=0;b.g.visible=false;placeBar(b.bar,0,0,0,0,false);for(let i=b.x;i<b.x+b.s;i++)for(let j=b.z;j<b.z+b.s;j++)BT.occ[j*GRID+i]=0;
  const r=new THREE.Group();r.position.set(b.cx,0,b.cz);const n=b.type==='wall'?3:6+b.s*3;for(let i=0;i<n;i++){const m=add(r,DO(rnd(.12,.3)*(b.type==='wall'?1:1.4)),Math.random()<.5?M.rubble:M.rockD,rnd(-b.s/2.4,b.s/2.4),.08,rnd(-b.s/2.4,b.s/2.4));m.rotation.set(rnd(0,3),rnd(0,3),0);}
  if(b.type!=='wall')add(r,CY(b.s*.45,b.s*.5,.06,12),M.dark,0,.03,0,false);bWorld.add(r);
  const p=new THREE.Vector3(b.cx,.6,b.cz);if(b.type==='wall'){fx('debris',p,5,{speed:2,size:.6,life:.8});fx('dust',p,3,{speed:1,size:.3,grav:-1,life:.8,grow:1.5});snd('hit');}
  else{explosion(p,true);fx('debris',p,12,{speed:3,size:.9,life:1.1});snd('boom');BT.destroyed++;if(b.type==='townhall')BT.thDead=true;}
  BT.troops.forEach(t=>{t.repath=true;});buildForbid();checkStars();}
function checkStars(){const pct=Math.round(BT.destroyed/BT.nonWall*100);BT.pct=pct;const s=(pct>=50?1:0)+(BT.thDead?1:0)+(pct>=100?1:0);
  if(s>BT.stars){for(let i=BT.stars;i<s;i++)$('#s'+(i+1)).classList.add('on');BT.stars=s;snd('win');}$('#bPct').textContent=pct+'%';if(pct>=100)setTimeout(finishBattle,1200);}
function killTroop(t){t.dead=true;bWorld.remove(t.g);placeBar(t.bar,0,0,0,0,false);fx('smoke',new THREE.Vector3(t.x,.4,t.z),4,{speed:.8,size:.22,grav:-1.5,life:.8,grow:1.4});}

function shoot(kind,from,tgt,dmg,o={}){let m;if(kind==='ball'){m=new THREE.Mesh(SP(.15,10,8),M.black);}else if(kind==='shell'){m=new THREE.Mesh(SP(.24,10,8),M.black);}else{m=new THREE.Mesh(BX(.04,.04,.5),M.trunk);}
  m.position.copy(from);bWorld.add(m);const p={kind,m,tgt,dmg,from:from.clone(),to:o.to?o.to.clone():null,t:0,dur:o.dur||0,splash:o.splash||0,speed:o.speed||16,onB:o.onB};BT.proj.push(p);}
function updProj(dt){for(let i=BT.proj.length-1;i>=0;i--){const p=BT.proj[i];
  if(p.kind==='shell'){p.t+=dt;const k=Math.min(1,p.t/p.dur);p.m.position.lerpVectors(p.from,p.to,k);p.m.position.y=p.from.y+(p.to.y-p.from.y)*k+Math.sin(k*Math.PI)*6;
    if(Math.random()<.5)fx('smoke',p.m.position,1,{speed:.1,size:.12,grav:0,life:.5,grow:1});
    if(k>=1){explosion(p.to,false);snd('boom');BT.troops.forEach(t=>{if(!t.dead&&Math.hypot(t.x-p.to.x,t.z-p.to.z)<p.splash){t.hp-=p.dmg;if(t.hp<=0)killTroop(t);}});p.m.removeFromParent();BT.proj.splice(i,1);}continue;}
  const tg=p.tgt;let tp;if(p.onB){tp=tmpV.set(tg.cx+rnd(-.2,.2),Math.min(1.2,tg.s*.3),tg.cz);}else tp=tmpV.set(tg.x,.5*(tg.T?tg.T.scale:1),tg.z);
  const dir=tp.clone().sub(p.m.position);const d=dir.length();const step=p.speed*dt;
  if(d<=step||(p.onB?tg.dead:tg.dead)){if(!tg.dead){if(p.onB)damageB(tg,p.dmg);else{tg.hp-=p.dmg;if(tg.hp<=0)killTroop(tg);}if(p.kind==='ball'){fx('spark',tp,4,{speed:2,size:.06,life:.3});snd('hit');}}p.m.removeFromParent();BT.proj.splice(i,1);continue;}
  dir.multiplyScalar(1/d);p.m.position.addScaledVector(dir,step);if(p.kind==='arrow')p.m.lookAt(tp);}}

function updTroop(t,dt){if(t.dead)return;t.at+=dt;
  if(!t.target||t.target.dead){t.target=chooseTarget(t);t.wall=null;t.path=null;if(!t.target){t.anim='idle';return;}}
  if(t.wall&&t.wall.dead){t.wall=null;t.path=null;}
  const tgt=t.wall||t.target;
  if(rectDist(t.x,t.z,tgt)<=t.T.range+.05){t.anim='attack';t.g.rotation.y=Math.atan2(tgt.cx-t.x,tgt.cz-t.z);t.cd-=dt;
    if(t.cd<=0){t.cd=t.T.rate;
      if(t.k==='sapper'){const p=new THREE.Vector3(t.x,.4,t.z);explosion(p,false);snd('boom');BT.bs.forEach(b=>{if(!b.dead&&rectDist(t.x,t.z,b)<1.4)damageB(b,b.type==='wall'?t.dmg*20:t.dmg);});t.hp=0;killTroop(t);return;}
      if(t.T.range>2){shoot('arrow',new THREE.Vector3(t.x,.6,t.z),tgt,t.dmg,{onB:true,speed:14});snd('arrow');}
      else{damageB(tgt,t.dmg);fx(t.k==='giant'?'dust':'spark',new THREE.Vector3(t.x+(tgt.cx-t.x)*.25,.5,t.z+(tgt.cz-t.z)*.25),t.k==='giant'?3:2,{speed:1.5,size:t.k==='giant'?.2:.05,life:.35,grav:t.k==='giant'?-1:9});if(Math.random()<.4)snd('hit');}}
    return;}
  if(t.wall){moveToward(t,t.wall.cx,t.wall.cz,dt);return;}
  if(!t.path||t.repath){t.repath=false;const ci=clamp(Math.floor(t.x+HALF),0,GRID-1),cj=clamp(Math.floor(t.z+HALF),0,GRID-1);t.path=astar(ci,cj,t.target,t.k==='sapper'?1.5:(t.k==='giant'?6:9));t.pi=0;if(!t.path)t.path=[];}
  if(t.pi<t.path.length){const c=t.path[t.pi];const o=BT.occ[c];if(o){const b=BT.bs[o-1];if(b.type==='wall'&&b!==t.target&&!b.dead){t.wall=b;return;}}
    const wx=(c%GRID)-HALF+.5+t.ox,wz=((c/GRID)|0)-HALF+.5+t.oz;if(moveToward(t,wx,wz,dt))t.pi++;}
  else moveToward(t,t.target.cx,t.target.cz,dt);}
function moveToward(t,x,z,dt){const dx=x-t.x,dz=z-t.z,d=Math.hypot(dx,dz);t.anim='walk';if(d<.12)return true;const s=Math.min(d,t.T.speed*dt);t.x+=dx/d*s;t.z+=dz/d*s;const want=Math.atan2(dx,dz);let diff=want-t.g.rotation.y;diff=Math.atan2(Math.sin(diff),Math.cos(diff));t.g.rotation.y+=diff*Math.min(1,dt*12);return d<.12+s;}

function updDefense(b,dt){if(b.dead||!b.isDef)return;const d=DEF[b.type],rng=d.range+b.s/2;b.cd-=dt;
  if(!b.tgt||b.tgt.dead||Math.hypot(b.tgt.x-b.cx,b.tgt.z-b.cz)>rng){b.tgt=null;let bd=1e9;BT.troops.forEach(t=>{if(t.dead)return;const dd=Math.hypot(t.x-b.cx,t.z-b.cz);if(dd<=rng&&(!d.minRange||dd>=d.minRange)&&dd<bd){bd=dd;b.tgt=t;}});}
  const t=b.tgt;if(!t)return;if(b.turret){const want=Math.atan2(t.x-b.cx,t.z-b.cz);let diff=want-b.turret.rotation.y;diff=Math.atan2(Math.sin(diff),Math.cos(diff));b.turret.rotation.y+=diff*Math.min(1,dt*(b.type==='mortar'?3:10));}
  if(b.cd<=0){b.cd=d.rate;const mz=b.turret&&b.turret.userData.muzzle?b.turret.localToWorld(b.turret.userData.muzzle.clone()):new THREE.Vector3(b.cx,1.5,b.cz);const dmg=d.dmg[b.lvl-1];
    if(b.type==='cannon'){shoot('ball',mz,t,dmg,{speed:20});fx('smoke',mz,3,{speed:.6,size:.18,grav:-1,life:.6,grow:2});snd('shot');b.turret.position.z=-.08;b.recoil=.15;}
    else if(b.type==='tower'){shoot('arrow',mz,t,dmg,{speed:22});snd('arrow');}
    else if(b.type==='mortar'){const to=new THREE.Vector3(t.x,.1,t.z);shoot('shell',mz,null,dmg,{to,dur:1.6,splash:d.splash});fx('smoke',mz,5,{speed:.8,size:.3,grav:-1,life:.9,grow:2});snd('boom');cam.shake=Math.max(cam.shake,.1);}}}

function tickBattle(dt){if(!BT)return;if(BT.fTime>0){BT.fTime-=dt;BT.fMesh.material.opacity=Math.min(.32,BT.fTime*.4);}else BT.fMesh.material.opacity=0;
  if(BT.over)return;if(BT.started||true){BT.time-=dt;}if(BT.time<=0){BT.time=0;finishBattle();return;}
  BT.troops.forEach(t=>updTroop(t,dt));BT.bs.forEach(b=>{updDefense(b,dt);if(b.recoil){b.recoil-=dt;if(b.recoil<=0&&b.turret)b.turret.position.z=0;}});updProj(dt);
  camRight.setFromMatrixColumn(camera.matrixWorld,0);
  BT.troops.forEach(t=>{if(t.dead)return;t.g.position.set(t.x,0,t.z);animTroop(t.g,t.at,t.anim);placeBar(t.bar,t.x,1.15*t.T.scale+.15,t.z,t.hp/t.maxhp,t.hp<t.maxhp);});
  BT.bs.forEach(b=>{if(!b.dead)placeBar(b.bar,b.cx,b.type==='wall'?1.3:b.s*.8+1.2,b.cz,b.hp/b.maxhp,b.hp<b.maxhp);});
  BT.troops=BT.troops.filter(t=>!t.dead||false);
  if(BT.started&&BT.troops.length===0&&Object.values(BT.army).every(v=>!v)&&BT.proj.length===0)finishBattle();
  updBattleHud();}
let hudAcc=0;function updBattleHud(){$('#bGold').textContent=fmt(BT.totG-BT.lootG);$('#bMana').textContent=fmt(BT.totM-BT.lootM);const s=Math.ceil(BT.time);$('#bTime').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function finishBattle(){if(!BT||BT.over)return;BT.over=true;const win=BT.stars>0;const tro=win?BT.stars*8+rint(2,8):-rint(8,16);
  for(const k in BT.deployed){S.army[k]=Math.max(0,(S.army[k]||0)-BT.deployed[k]);}
  const g=addRes('gold',BT.lootG),m=addRes('mana',BT.lootM);S.trophies=Math.max(0,S.trophies+tro);gainXp(win?BT.stars*6:1);if(BT.stars===3)S.res.gems+=5;save();
  const st=[1,2,3].map(i=>`<span style="color:${i<=BT.stars?'var(--gold)':'#3a4357'};-webkit-text-stroke:2px var(--edge)">★</span>`).join('');
  resultOpen=true;setTimeout(()=>{openModal(win?'Victoire !':'Défaite',`<div class="result"><div class="stars">${st}</div><div class="big-t out">${BT.pct}% détruit</div>
    <div class="row out"><span><span class="ico coin sm"></span> +${fmt(g)}</span><span><span class="ico drop sm"></span> +${fmt(m)}</span><span><span class="cup" style="display:inline-block;width:16px;height:16px;vertical-align:-2px"></span> ${tro>0?'+':''}${tro}</span>${BT.stars===3?'<span><span class="ico gem sm"></span> +5</span>':''}</div>
    ${g+1<BT.lootG||m+1<BT.lootM?'<p class="note">Une partie du butin a été perdue : tes stockages sont pleins.</p>':''}
    <button class="btn ok" data-act="home" style="font-size:20px;padding:10px 28px">Retour au village</button></div>`);resultOpen=true;},900);}
function endBattleReturn(){resultOpen=false;if(BT){BT.proj.forEach(p=>p.m.removeFromParent());}BT=null;bWorld.clear();FX.forEach(p=>p.m.removeFromParent());FX.length=0;mode='village';world.visible=true;$('#bHud').hidden=true;$('#vHud').hidden=false;$('#cornerL').hidden=$('#cornerR').hidden=false;cam.target.set(0,0,1);cam.dist=44;updateCamera();refreshHud();refreshSel();}

/* ================= BOUCLE ================= */
let last=performance.now(),T=0;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(innerWidth<innerHeight&&cam.dist<52&&mode==='village')cam.dist=Math.max(cam.dist,56);updateCamera();}
addEventListener('resize',resize);
function loop(){requestAnimationFrame(loop);const n=performance.now();let dt=Math.min(.05,(n-last)/1000);last=n;T+=dt;
  if(mode==='village')tickVillage(dt);else tickBattle(dt);
  if(cam.shake>0){cam.shake=Math.max(0,cam.shake-dt*1.2);updateCamera();}
  const root=mode==='village'?world:bWorld;
  root.traverse(o=>{const u=o.userData;if(u.spin)o.rotation.y+=u.spin*dt;if(u.bob)o.position.y=u.bob+Math.sin(T*2)*.12;if(u.fire){const s=1+Math.sin(T*(14+u.fire*3))*.15;o.scale.set(s,1+Math.sin(T*11+u.fire)*.25,s);}if(u.wave)o.rotation.y=Math.sin(T*3+o.position.x)*.35;
    if(u.hammer)animTroop(o,T,'attack');if(u.bounce){u.bounce=Math.max(0,u.bounce-dt);const k=1+Math.sin(u.bounce*25)*u.bounce*.25;o.scale.set(1/Math.sqrt(k),k,1/Math.sqrt(k));if(!u.bounce)o.scale.set(1,1,1);}});
  if(mode==='village'){S.buildings.forEach(b=>{const d=DEF[b.type];if(!d.prod)return;const g=VM.get(b.id);if(!g)return;let bub=g.userData.bub;const show=!isUp(b)&&b.stored>=Math.max(5,d.cap[b.lvl-1]*.01);
    if(show&&!bub){bub=new THREE.Sprite(BUB[b.type==='goldmine'?'gold':'mana']);bub.scale.set(1.1,1.1,1);bub.renderOrder=990;g.add(bub);g.userData.bub=bub;}if(bub){bub.visible=show;bub.position.y=3+Math.sin(T*3+b.id)*.15;}});}
  updFX(dt);updLabels();renderer.render(scene,camera);}

/* ================= DÉMARRAGE ================= */
load();offline();
try{makeThumbs();}catch(e){}
buildVillage();resize();refreshHud();refreshSel();
$('#loading').remove();
if(!localStorage||true){try{if(!localStorage.getItem(SAVE_KEY+'-seen')){localStorage.setItem(SAVE_KEY+'-seen','1');setTimeout(()=>toast('Bienvenue, Chef ! Touche une mine pour récolter, puis attaque !'),600);}}catch(e){}}
addEventListener('visibilitychange',()=>{if(document.hidden)save();else{offline();last=performance.now();}});
loop();
})();
</script>
