<title>Duel des Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: arène 3D plein écran, barre de score en haut, main de cartes + élixir en bas */
:root{
  --edge:#0b1322; --ink:#fff; --muted:#c3cfe4;
  --blue:#2f7cf0; --blueD:#163f8a; --red:#e2413a; --redD:#7e1611;
  --elixir:#d24bff; --elixirD:#6b1497; --gold:#ffcc33; --wood:#6b4426; --woodL:#a87445;
  --f-display:'Lilita One','Arial Black',Impact,sans-serif; --f-body:'Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#3b6d2c;color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ui{position:fixed;inset:0;pointer-events:none;font-weight:800}
#ui *{box-sizing:border-box}
.out{text-shadow:0 2px 0 var(--edge),1.5px 0 0 var(--edge),-1.5px 0 0 var(--edge),0 -1.5px 0 var(--edge)}
b,.num{font-variant-numeric:tabular-nums}
/* barre du haut */
#top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:6px}
.crowns{display:flex;align-items:center;gap:3px;padding:4px 10px;border-radius:12px;border:2px solid var(--edge)}
.crowns.red{background:linear-gradient(#ff6a5e,var(--red))}.crowns.blue{background:linear-gradient(#64a6ff,var(--blue))}
.crown{width:22px;height:18px;background:#283247;clip-path:polygon(0 100%,0 25%,25% 55%,50% 0,75% 55%,100% 25%,100% 100%);opacity:.55}
.crown.on{background:linear-gradient(#fff3a0,var(--gold) 60%,#b67d0a);opacity:1}
#clock{min-width:86px;text-align:center;background:rgba(10,16,30,.82);border:2px solid var(--edge);border-radius:12px;padding:2px 10px;line-height:1.05}
#clock small{display:block;font-size:10px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
#clock b{font-family:var(--f-display);font-size:24px;font-weight:400}
#clock.ot b{color:#ffb12e}
#banner{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.6);font-family:var(--f-display);font-size:34px;text-align:center;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* main de cartes */
#hand{position:absolute;left:0;right:0;bottom:0;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(8px,env(safe-area-inset-left,0px));
  background:linear-gradient(#5a3a20,#3b2513);border-top:3px solid var(--edge);box-shadow:0 -6px 18px rgba(0,0,0,.35);pointer-events:auto;display:flex;flex-direction:column;gap:6px}
#handRow{display:flex;gap:6px;align-items:flex-end;justify-content:center}
#nextBox{width:46px;flex:none;text-align:center;font-size:9px;color:#e8d4b8;text-transform:uppercase;letter-spacing:.5px}
#nextBox img{width:46px;height:56px;object-fit:cover;border-radius:7px;border:2px solid var(--edge);background:#cfe0f5;display:block;margin-top:2px;filter:brightness(.85)}
.card{position:relative;flex:1;max-width:84px;aspect-ratio:.78;border-radius:10px;border:3px solid var(--edge);background:linear-gradient(#e5f0ff,#9fc1ea);padding:0;cursor:pointer;overflow:hidden;touch-action:none;transition:transform .12s}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .cost{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:26px;height:28px;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;color:#fff;
  background:radial-gradient(circle at 40% 30%,#f2b6ff,var(--elixir) 50%,var(--elixirD));border:2px solid var(--edge);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.card .nm{position:absolute;left:0;right:0;top:2px;font-size:9.5px;text-align:center;color:#fff;font-weight:900}
.card .lock{position:absolute;inset:0;background:rgba(20,22,30,.55);transform-origin:top;transition:transform .1s linear}
.card.sel{transform:translateY(-10px);border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
.card:focus-visible{outline:3px solid #fff}
#elix{display:flex;align-items:center;gap:6px}
#elixN{flex:none;width:32px;height:34px;display:grid;place-items:center;font-family:var(--f-display);font-size:19px;background:radial-gradient(circle at 40% 30%,#f2b6ff,var(--elixir) 50%,var(--elixirD));border:2px solid var(--edge);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
#elixBar{position:relative;flex:1;height:20px;background:#1b1022;border:2px solid var(--edge);border-radius:8px;overflow:hidden}
#elixBar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(#f0a8ff,#c23cf2 55%,#8c1fc0)}
#elixBar .seg{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 2px),rgba(11,19,34,.85) calc(10% - 2px),rgba(11,19,34,.85) 10%)}
#elixBar.x2 i{background:linear-gradient(#ffd4ff,#e45cff 55%,#b02be0)}
/* écrans */
.screen{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,rgba(40,70,140,.55),rgba(6,10,22,.86));pointer-events:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.box{width:min(100%,430px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.title{font-family:var(--f-display);font-size:clamp(40px,12vw,58px);line-height:.95;letter-spacing:1px;color:#fff;text-wrap:balance}
.title span{display:block;font-size:.5em;color:var(--gold)}
.trophy{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:24px;background:rgba(0,0,0,.35);padding:4px 16px;border-radius:14px;border:2px solid var(--edge)}
.cup{width:22px;height:24px;border-radius:4px 4px 11px 11px;background:linear-gradient(#ffe27a,#d99a12);border:2px solid var(--edge)}
.deck{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.deck div{position:relative;aspect-ratio:.78;border-radius:9px;border:2px solid var(--edge);overflow:hidden;background:linear-gradient(#e5f0ff,#9fc1ea)}
.deck img{width:100%;height:100%;object-fit:cover}
.deck b{position:absolute;left:3px;top:2px;font-family:var(--f-display);font-weight:400;font-size:14px;color:#fff;text-shadow:0 2px 0 #000}
.btn{pointer-events:auto;font-family:var(--f-display);font-size:24px;color:#fff;letter-spacing:.5px;border:3px solid var(--edge);border-radius:16px;padding:12px 40px;cursor:pointer;
  background:linear-gradient(#ffd75e,#f0a10c);box-shadow:0 5px 0 #8a5a00,inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 rgba(0,0,0,.45);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a5a00}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hint{font-size:13px;color:var(--muted);font-weight:700;max-width:36ch;line-height:1.4}
.res-crowns{display:flex;gap:18px;align-items:center;justify-content:center;font-family:var(--f-display);font-size:42px}
.res-crowns .crown{width:44px;height:36px}
#tlabels{position:absolute;inset:0;overflow:hidden}
.tw{position:absolute;transform:translate(-50%,-100%);text-align:center;font-size:11px;font-weight:900;white-space:nowrap}
.tw .hb{width:62px;height:10px;margin-top:1px;background:#111826;border:2px solid var(--edge);border-radius:5px;overflow:hidden}
.tw .hb i{display:block;height:100%}
.tw.p .hb i{background:linear-gradient(#7fb6ff,var(--blue))}.tw.e .hb i{background:linear-gradient(#ff8a80,var(--red))}
.tw.king .hb{width:78px}
.dmg{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:15px;pointer-events:none}
@media (prefers-reduced-motion:reduce){.card,.btn,#banner{transition:none}}
.ico{display:inline-block;width:30px;height:30px;flex:none}
/* ===== Écran d'accueil ===== */
.home{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(ellipse 70% 45% at 8% 48%,rgba(60,140,255,.95),transparent 70%),radial-gradient(ellipse 70% 45% at 95% 50%,rgba(255,60,120,.95),transparent 70%),
  radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,200,90,.35),transparent 70%),linear-gradient(#141f5c 0%,#2a2a86 35%,#6a2c9a 70%,#2c1a62 100%);
  padding-top:env(safe-area-inset-top,0px)}
.home::before{content:"";position:absolute;inset:-20% -30% 30%;pointer-events:none;opacity:.55;mix-blend-mode:screen;
  background:conic-gradient(from 180deg at 50% 0%,transparent 0 150deg,rgba(255,255,255,.22) 158deg,transparent 166deg 176deg,rgba(255,240,200,.18) 184deg,transparent 192deg 200deg,rgba(255,255,255,.2) 208deg,transparent 216deg);
  animation:beams 9s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes beams{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.home>*{position:relative}
.h-top{display:flex;gap:6px;padding:6px max(8px,env(safe-area-inset-right,0px)) 4px max(8px,env(safe-area-inset-left,0px));align-items:center}
.h-res{flex:1;min-width:0;position:relative;display:flex;align-items:center;height:30px;background:linear-gradient(#0d1640,#1c2a66);border:2px solid #0a0f2a;border-radius:9px;box-shadow:inset 0 2px 0 rgba(255,255,255,.08);padding:0 6px 0 30px}
.h-res b{flex:1;text-align:right;font-family:var(--f-display);font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-res .ico{position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:32px;height:32px}
.ico.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b8,#ffd23a 40%,#c68506 80%);border:2px solid #4a2e00;box-shadow:inset -2px -3px 0 rgba(0,0,0,.18)}
.ico.gem{width:28px!important;height:28px!important;left:-3px!important;clip-path:polygon(50% 0,95% 28%,95% 72%,50% 100%,5% 72%,5% 28%);background:linear-gradient(135deg,#d6ffd0 0,#4be04b 35%,#119d2a 70%,#0b6b1c)}
.ico.sm{position:static!important;display:inline-block;width:18px!important;height:18px!important;transform:none!important;vertical-align:-4px}
.plus{flex:none;margin-left:4px;width:20px;height:20px;padding:0;border-radius:5px;border:2px solid #0a0f2a;background:linear-gradient(#7de05a,#36a420);color:#fff;font:400 16px/14px var(--f-display);cursor:pointer}
.lvlshield{position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:34px;height:36px;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;
  background:linear-gradient(#7ec8ff,#2a6fe0);border:2px solid #0a1a44;clip-path:polygon(50% 0,100% 18%,100% 70%,50% 100%,0 70%,0 18%)}
.h-res .hbar{flex:1;height:12px;border-radius:6px;background:#0a1030;overflow:hidden;margin-right:6px}
.h-res .hbar i{display:block;height:100%;width:0;background:linear-gradient(#7ff0ff,#18a8e8)}
.h-res.lvl b{flex:none;font-size:13px}
.h-mid{display:flex;gap:8px;align-items:stretch;padding:2px max(8px,env(safe-area-inset-right,0px)) 0 0}
.h-banner{flex:1.25;min-width:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px 6px max(10px,env(safe-area-inset-left,0px));
  background:linear-gradient(100deg,#3a2a9a 0%,#4b37b8 55%,rgba(75,55,184,0) 100%);border-bottom:3px solid #1b1250;clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%);min-height:96px}
.h-banner img{position:absolute;right:9%;bottom:0;width:78px;height:100px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.h-name b{display:block;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1;cursor:pointer}
.h-name small{display:block;font-size:12px;color:#ffd86a;font-weight:900;letter-spacing:.3px;margin-top:2px}
.h-tro{display:flex;align-items:center;gap:6px;margin-top:6px;background:rgba(10,8,40,.45);border-radius:8px;padding:3px 10px;align-self:flex-start;font-family:var(--f-display);font-size:20px;color:#ffd447}
.cup{width:24px;height:24px;flex:none;background:linear-gradient(#fff2a0,#f2b414 50%,#a46a00);clip-path:polygon(8% 0,92% 0,90% 30%,72% 58%,58% 64%,58% 80%,76% 86%,76% 100%,24% 100%,24% 86%,42% 80%,42% 64%,28% 58%,10% 30%)}
.h-right{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.h-icons{display:flex;gap:6px;justify-content:flex-end}
.sq{width:44px;height:40px;border-radius:8px;border:2px solid #0a1030;background:linear-gradient(#3550a8,#22357a);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 3px 0 #0a1030;display:grid;place-items:center;cursor:pointer;padding:0}
.sq svg{width:28px;height:28px}
.pass{position:relative;border:2px solid #5a3200;border-radius:12px;padding:3px 6px 6px;cursor:pointer;background:linear-gradient(#ffd25a,#f2a316);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 0 #6a3a00;text-align:left;color:#5a2e00}
.pass-t{display:block;font-family:var(--f-display);font-size:13px;letter-spacing:.3px;color:#6b3400}
.pass-row{display:flex;align-items:center;gap:4px}
.pass-lvl{width:26px;height:26px;flex:none;display:grid;place-items:center;transform:rotate(45deg);background:linear-gradient(#ffe066,#e09400);border:2px solid #5a3200;border-radius:4px;font:400 14px var(--f-display);color:#3a2000}
.pass-lvl span{transform:rotate(-45deg)}
.pass-bar{position:relative;flex:1;height:20px;background:#7a4a0a;border:2px solid #5a3200;border-radius:7px;overflow:hidden}
.pass-bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(#ffe98a,#ffbf1f)}
.pass-bar b{position:relative;display:block;text-align:center;font:400 14px/16px var(--f-display);color:#fff;text-shadow:0 1px 0 #3a2000}
.pass .dot{position:absolute;top:-8px;right:-6px}
.dot{min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#e8282a;border:2px solid #fff;color:#fff;font:400 12px/16px var(--f-display);text-align:center}
.h-stage{flex:1;min-height:200px;position:relative}
#dio{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.h-left,.h-rightcol{position:absolute;top:10px;display:flex;flex-direction:column;gap:12px;z-index:2}
.h-left{left:max(8px,env(safe-area-inset-left,0px))}.h-rightcol{right:max(8px,env(safe-area-inset-right,0px));align-items:center}
.rb{position:relative;width:60px;height:60px;border-radius:50%;border:3px solid #6b3a00;background:radial-gradient(circle at 50% 35%,#fff0a8,#ffc83a 55%,#d88a08);box-shadow:0 4px 0 #5a2e00,inset 0 -4px 0 rgba(0,0,0,.15);cursor:pointer;padding:0;display:grid;place-items:center}
.rb svg{width:36px;height:36px}
.rb .dot{position:absolute;top:-6px;right:-6px}
.tk{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;cursor:pointer;color:#fff}
.tk .tkimg{width:62px;height:52px;border-radius:10px;border:3px solid #5a2e00;background:linear-gradient(#ffd85a,#f0a20f);box-shadow:0 4px 0 #5a2e00;display:grid;place-items:center}
.tk .tkimg svg{width:40px;height:34px}
.tk.mag .tkimg{border-radius:50%;width:60px;height:60px;background:radial-gradient(circle at 40% 35%,#9ee7ff,#3a8cf0 50%,#7a3ad8);border-color:#2a1460;box-shadow:0 4px 0 #2a1460}
.tk b{font:400 14px var(--f-display)}
.h-arena{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:min(78%,330px);z-index:2;text-align:center}
.ar-name{display:inline-block;font:400 15px var(--f-display);padding:3px 12px;border-radius:8px;background:rgba(10,10,40,.55);margin-bottom:4px}
.ar-bar{display:flex;align-items:center;gap:6px;background:rgba(10,12,40,.75);border:2px solid #0a0f2a;border-radius:10px;padding:4px 8px}
.ar-bar .cup{width:20px;height:20px}
.segbar{flex:1;height:14px;border-radius:7px;background:#0a1030;overflow:hidden;position:relative}
.segbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#7ac8ff,#2a7af0)}
.segbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 2px),rgba(10,16,48,.9) calc(12.5% - 2px) 12.5%)}
.ar-bar span{font:400 13px var(--f-display);min-width:34px;text-align:right}
.h-event{display:flex;flex-direction:column;align-items:center;padding:4px 0 0;z-index:2}
.h-event small{font:400 13px var(--f-display);background:linear-gradient(#7a46e0,#4b24a8);padding:3px 30px 6px;border-radius:12px 12px 0 0;border:2px solid #1e0d55;border-bottom:0;margin-bottom:-6px;position:relative;z-index:1}
.ev{position:relative;width:min(64%,290px);height:62px;border-radius:14px;border:3px solid #6b3a00;background:linear-gradient(#ffe066,#f7b21a 55%,#e48d06);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 5px 0 #6b3a00;cursor:pointer;color:#fff;font:400 20px var(--f-display);text-shadow:0 2px 0 #6b3a00;padding:0}
.ev em{display:block;font-style:normal;font-size:12px;color:#fff8d0;text-shadow:0 1px 0 #6b3a00}
.ev.done{filter:grayscale(.7) brightness(.85)}
.h-battle{display:flex;align-items:stretch;gap:0;justify-content:center;padding:10px max(8px,env(safe-area-inset-right,0px)) 10px max(8px,env(safe-area-inset-left,0px))}
.deckbtn,.road{position:relative;width:24%;max-width:104px;border:3px solid #0a1030;cursor:pointer;padding:6px}
.deckbtn{border-radius:16px 0 0 16px;background:linear-gradient(#3f6fe8,#1e44b0);box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.deckbtn img{width:100%;aspect-ratio:.8;object-fit:cover;border-radius:10px;border:3px solid #a8c8ff;background:linear-gradient(#e5f0ff,#9fc1ea);display:block}
.deckbtn .lv{position:absolute;right:2px;bottom:4px;font:400 18px var(--f-display);background:#1e44b0;border:2px solid #fff;border-radius:6px;padding:0 6px;color:#fff}
.road{border-radius:0 16px 16px 0;background:linear-gradient(#ff6a7a,#d8344a);box-shadow:inset 0 2px 0 rgba(255,255,255,.3);display:grid;place-items:center}
.road svg{width:62px;height:62px}
.road .dot{position:absolute;top:4px;right:4px}
.combat{flex:1;max-width:220px;border:3px solid #6b3a00;border-left-width:0;border-right-width:0;cursor:pointer;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:stretch;gap:4px;
  background:linear-gradient(#ffd84a,#f5a40c 60%,#e38804);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 5px 0 #6b3a00}
.combat .c-t{font:400 34px/1 var(--f-display);color:#fff;text-shadow:0 3px 0 #6b3a00,1px 0 0 #6b3a00,-1px 0 0 #6b3a00;letter-spacing:.5px}
.combat .c-s{display:flex;align-items:center;gap:6px;background:linear-gradient(#e08a08,#c46d00);border-radius:8px;padding:3px 6px;color:#fff;text-align:left}
.combat .c-s b{font:400 17px var(--f-display);line-height:1}
.combat .c-s small{display:block;font-size:10px;font-weight:900;color:#ffe9b0}
.mini-crowns{display:flex}
.mini-crowns .crown{width:18px;height:15px;margin-right:-6px}
.h-nav{display:flex;align-items:stretch;background:linear-gradient(#26407a,#152650);border-top:3px solid #0a1030;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.h-nav button{position:relative;flex:1;border:0;border-right:2px solid #0a1030;background:none;cursor:pointer;padding:8px 0 6px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font:400 12px var(--f-display)}
.h-nav button:last-child{border-right:0}
.h-nav button svg{width:44px;height:40px;transition:transform .15s}
.h-nav button span{height:0;overflow:hidden;transition:height .15s}
.h-nav button.on{flex:1.6;background:linear-gradient(#3e64c4,#2a4aa0)}
.h-nav button.on svg{transform:translateY(-10px) scale(1.25)}
.h-nav button.on span{height:16px;margin-top:-8px;font-size:15px}
.h-nav .dot{position:absolute;top:4px;right:12%}
.home .hidden-sm{display:none}
/* feuilles (panneaux) */
.sheet{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,8,24,.55);pointer-events:auto;padding:max(12px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}

const alive=e=>e&&e.hp>0;

function findTarget(u){if(u.tg!=='buildings'){let best=null,bd=SIGHT;for(const e of G.ents){if(e.tower||!canHit(u,e))continue;const d=edge(u,e);if(d<bd){bd=d;best=e;}}if(best)return best;}
 if(u.tg==='buildings'){return laneTower(u);}let best=null,bd=SIGHT;for(const e of G.ents){if(!e.tower||!canHit(u,e))continue;const d=edge(u,e);if(d<bd){bd=d;best=e;}}return best||laneTower(u);}
function waypoint(u,t){if(u.fly)return t;const bx=BRIDGES.reduce((a,b)=>Math.abs(b-u.x)+Math.abs(b-t.x)<Math.abs(a-u.x)+Math.abs(a-t.x)?b:a);
 if(Math.abs(u.z)<RIVER+.15)return {x:Math.abs(u.x-bx)<1.3?bx:u.x,z:(t.z>u.z?1:-1)*(RIVER+.6)};
 if((u.z>0)!==(t.z>0)){const ez=(u.z>0?1:-1)*(RIVER-.05);return {x:bx,z:ez};}return t;}

function kill(e){e.hp=0;if(e.tower){e.g.visible=false;e.lab.remove();const r=new THREE.Group();r.position.set(e.x,0,e.z);ents.add(r);for(let i=0;i<14;i++){const m=add(r,DO(rnd(.18,.45)),M.rubble,rnd(-e.r,e.r)*.8,.1,rnd(-e.r,e.r)*.8);m.rotation.set(rnd(0,3),rnd(0,3),0);}
   add(r,CY(e.r*.9,e.r,.12,14),M.stoneD,0,.06,0);const p=new THREE.Vector3(e.x,1.2,e.z);boom(p,true);fx('debris',p,16,{speed:3.5,size:1,life:1.2});snd('boom');
   const winner=1-e.team;if(e.king){G.crowns[winner]=3;}else{G.crowns[winner]=Math.min(3,G.crowns[winner]+1);const k=G.ents.find(x=>x.tower&&x.king&&x.team===e.team);if(k)k.active=true;}
   updCrowns();snd('crown');banner(winner===0?'Couronne !':'Tour perdue',1.2);rebuildForbid();if(e.king||G.ot)setTimeout(()=>endMatch(),1300);}
 else{e.g.removeFromParent();placeBar(e.bar,0,0,0,0,false);fx('smoke',new THREE.Vector3(e.x,e.fly?2:.4,e.z),5,{speed:.8,size:.25,grav:-1.5,life:.8,grow:1.4});}}

function shoot(kind,from,tgt,dmg,src,o={}){let m;if(kind==='ball'){m=new THREE.Mesh(SP(.17,10,8),M.iron);}else if(kind==='fire'){m=new THREE.Mesh(SP(.16,10,8),M.glow);}else{m=new THREE.Mesh(BX(.04,.04,.55),M.wood);}
 m.position.copy(from);ents.add(m);G.proj.push({kind,m,tgt,dmg,src,team:src.team,splash:o.splash||0,speed:o.speed||16,tg:src.tg});}
function updProj(dt){for(let i=G.proj.length-1;i>=0;i--){const p=G.proj[i];
 if(p.kind==='spell'){p.t+=dt;const k=Math.min(1,p.t/p.dur);p.m.position.lerpVectors(p.from,p.to,k);p.m.position.y+=Math.sin(k*Math.PI)*3;fx('flame',p.m.position,1,{speed:.3,size:.25,grav:-1,life:.35,grow:1});
   if(k>=1){boom(p.to,true);snd('boom');for(const e of G.ents){if(e.team===p.team||e.hp<=0)continue;if(Math.hypot(e.x-p.to.x,e.z-p.to.z)<p.radius+(e.r||0)){damage(e,e.tower?p.dmg*CARDS.fireball.tower:p.dmg);if(!e.tower&&!e.fly&&e.c.r<.6){const dx=e.x-p.to.x,dz=e.z-p.to.z,d=Math.hypot(dx,dz)||1;e.x+=dx/d*.8;e.z+=dz/d*.8;}}}
     p.m.removeFromParent();G.proj.splice(i,1);}continue;}
 const t=p.tgt;const tp=new THREE.Vector3(t.x,t.tower?1.6:(t.fly?2.2:.55),t.z);const dir=tp.clone().sub(p.m.position),d=dir.length(),step=p.speed*dt;
 if(d<=step||t.hp<=0){if(t.hp>0||p.splash){if(p.splash){for(const e of G.ents){if(e.team===p.team||e.hp<=0)continue;if(e.fly&&p.tg!=='all')continue;if(Math.hypot(e.x-tp.x,e.z-tp.z)<p.splash+(e.r||0)*.5)damage(e,p.dmg);}fx('flame',tp,6,{speed:1.4,size:.22,grav:-1,life:.35,grow:2});}
     else damage(t,p.dmg);if(p.kind==='ball'){fx('spark',tp,4,{speed:2,size:.06,life:.3});snd('hit');}}p.m.removeFromParent();G.proj.splice(i,1);continue;}
 dir.multiplyScalar(1/d);p.m.position.addScaledVector(dir,step);if(p.kind==='arrow')p.m.lookAt(tp);}}

function updUnit(u,dt){u.at+=dt;if(u.spawn>0){u.spawn-=dt;const k=1-Math.max(0,u.spawn-.6)/.4;u.g.scale.setScalar(u.g.userData.base*Math.min(1,k));return;}
 u.re-=dt;if(!alive(u.target)||(u.re<=0&&(u.target.tower||edge(u,u.target)>u.c.range+.2))){u.re=.35;const nt=findTarget(u);if(nt!==u.target){u.target=nt;}}
 const t=u.target;if(!t){u.anim='idle';return;}
 if(edge(u,t)<=u.c.range){u.anim='attack';const a=Math.atan2(t.x-u.x,t.z-u.z);u.g.rotation.y=a;u.cd-=dt;
   if(u.cd<=0){u.cd=u.c.hs;if(u.c.proj){shoot(u.c.proj,new THREE.Vector3(u.x,u.fly?2.2:.75*(u.c.model==='giant'?1.9:1),u.z),t,u.dmg,u,{splash:u.c.splash,speed:u.c.proj==='fire'?11:15});snd(u.c.proj==='fire'?'fire':'arrow');}
     else{damage(t,u.dmg,u);fx(u.c.model==='giant'?'dust':'spark',new THREE.Vector3(u.x+(t.x-u.x)*.3,.6,u.z+(t.z-u.z)*.3),u.c.model==='giant'?4:3,{speed:1.6,size:u.c.model==='giant'?.25:.06,life:.35,grav:u.c.model==='giant'?-1:9});if(Math.random()<.4)snd('hit');}}
   return;}
 if(u.cd>u.c.hs*.5)u.cd=u.c.hs*.5;
 const w=waypoint(u,t);const dx=w.x-u.x,dz=w.z-u.z,d=Math.hypot(dx,dz)||1;const s=Math.min(d,u.c.speed*dt);u.x+=dx/d*s;u.z+=dz/d*s;u.anim='walk';
 const want=Math.atan2(dx,dz);let diff=want-u.g.rotation.y;diff=Math.atan2(Math.sin(diff),Math.cos(diff));u.g.rotation.y+=diff*Math.min(1,dt*10);}
function collide(){const us=G.ents.filter(e=>!e.tower&&e.hp>0);for(let i=0;i<us.length;i++){const a=us[i];
  for(let j=i+1;j<us.length;j++){const b=us[j];if(a.fly!==b.fly)continue;const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz)||.01,m=a.r+b.r;if(d<m){const push=(m-d)/2,ma=a.c.r*a.c.r,mb=b.c.r*b.c.r,wa=mb/(ma+mb),wb=ma/(ma+mb);a.x-=dx/d*push*wa*1.6;a.z-=dz/d*push*wa*1.6;b.x+=dx/d*push*wb*1.6;b.z+=dz/d*push*wb*1.6;}}
  if(!a.fly){for(const t of G.ents){if(!t.tower||t.hp<=0)continue;const dx=a.x-t.x,dz=a.z-t.z,d=Math.hypot(dx,dz)||.01,m=a.r+t.r;if(d<m){a.x=t.x+dx/d*m;a.z=t.z+dz/d*m;}}
    if(Math.abs(a.z)<RIVER+.1&&!BRIDGES.some(b=>Math.abs(a.x-b)<1.1)){a.z=(a.z>=0?1:-1)*(RIVER+.1);}if(Math.abs(a.z)<RIVER+.1){const b=BRIDGES.reduce((p,c)=>Math.abs(c-a.x)<Math.abs(p-a.x)?c:p);a.x=clamp(a.x,b-1,b+1);}}
  a.x=clamp(a.x,-AW+.3,AW-.3);a.z=clamp(a.z,-AL+.3,AL-.3);}}
function updTower(t,dt){if(t.hp<=0)return;if(!t.active){if(t.g.userData.kingFig)t.g.userData.kingFig.rotation.y=Math.sin(G.time*.8)*.3;return;}
 t.cd-=dt;if(!alive(t.tgt)||Math.hypot(t.tgt.x-t.x,t.tgt.z-t.z)-t.tgt.r>t.range){t.tgt=null;let bd=1e9;for(const e of G.ents){if(e.tower||e.team===t.team||e.hp<=0||e.spawn>0)continue;const d=Math.hypot(e.x-t.x,e.z-t.z)-e.r;if(d<=t.range&&d<bd){bd=d;t.tgt=e;}}}
 const e=t.tgt;if(!e)return;const local=Math.atan2(e.x-t.x,e.z-t.z)-t.g.rotation.y;let diff=local-t.turret.rotation.y;diff=Math.atan2(Math.sin(diff),Math.cos(diff));t.turret.rotation.y+=diff*Math.min(1,dt*10);
 if(t.cd<=0){t.cd=t.hs;const mz=t.turret.localToWorld(t.turret.userData.muzzle.clone());if(t.king){shoot('ball',mz,e,t.dmg,t,{speed:18});fx('smoke',mz,3,{speed:.6,size:.2,grav:-1,life:.6,grow:2});snd('shot');}else{shoot('arrow',mz,e,t.dmg,t,{speed:20});snd('arrow');}}}

function tick(dt){if(!G||G.over)return;G.time+=dt;G.t-=dt;
 if(!G.x2&&(G.t<=60||G.ot)){G.x2=true;$('#elixBar').classList.add('x2');banner('Élixir x2 !',1.4);}
 const rate=(G.x2?2:1)/2.8;G.elixir[0]=Math.min(10,G.elixir[0]+rate*dt);G.elixir[1]=Math.min(10,G.elixir[1]+rate*dt*G.aiBoost);
 if(G.t<=0){if(!G.ot&&G.crowns[0]===G.crowns[1]){G.ot=true;G.t=60;$('#clock').classList.add('ot');$('#clockLbl').textContent='Prolongation';banner('Prolongation : mort subite !',1.8);}else{endMatch();return;}}
 aiThink(dt);for(const e of G.ents){if(e.hp<=0)continue;if(e.tower)updTower(e,dt);else updUnit(e,dt);}collide();updProj(dt);
 G.ents=G.ents.filter(e=>e.tower||e.hp>0);
 for(const e of G.ents){if(e.tower||e.hp<=0)continue;e.g.position.set(e.x,e.fly?2.2+Math.sin(e.at*3)*.1:0,e.z);animUnit(e.g,e.at,e.anim);const top=e.fly?3.1:(e.c.model==='giant'?2.2:1.35);placeBar(e.bar,e.x,top,e.z,e.hp/e.max,e.hp<e.max);}
 const s=Math.max(0,Math.ceil(G.t));$('#clockT').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');updHand();}
function updLabels(){if(!G)return;const v=new THREE.Vector3();for(const e of G.ents){if(!e.tower||e.hp<=0)continue;v.set(e.x,(e.king?3.6:3.9)+.9,e.z).project(camera);e.lab.style.left=((v.x+1)/2*innerWidth)+'px';e.lab.style.top=((1-v.y)/2*innerHeight)+'px';
 e.lab.firstChild.textContent=Math.ceil(e.hp);e.lab.lastChild.firstChild.style.width=(e.hp/e.max*100)+'%';}}
function endMatch(){if(!G||G.over)return;G.over=true;marker.visible=forbid.visible=false;const p=G.crowns[0],e=G.crowns[1];let title,tro;
 if(p>e){title='Victoire !';tro=30+p*2;}else if(e>p){title='Défaite';tro=-20;}else{const hpP=Math.min(...G.ents.filter(x=>x.tower&&x.team===0&&x.hp>0).map(x=>x.hp/x.max)),hpE=Math.min(...G.ents.filter(x=>x.tower&&x.team===1&&x.hp>0).map(x=>x.hp/x.max));
   if(Math.abs(hpP-hpE)<.01){title='Égalité';tro=0;}else if(hpP>hpE){title='Victoire !';tro=25;}else{title='Défaite';tro=-20;}}
 P.trophies=Math.max(0,P.trophies+tro);const gold=reward(tro>0,title==='Égalité',p,p);
 setTimeout(()=>{$('#resTitle').textContent=title;const cr=n=>[0,1,2].map(i=>`<span class="crown ${i<n?'on':''}"></span>`).join('');$('#resP').innerHTML=cr(p);$('#resE').innerHTML=cr(e);$('#resTro').textContent=(tro>0?'+':'')+tro;$('#resGold').textContent='+'+gold;

 const k=G.hand[0][G.sel],c=CARDS[k];const ok=canPlace(0,k,p.x,p.z)&&G.elixir[0]>=c.cost;marker.visible=true;marker.position.set(p.x,0,p.z);const r=c.spell?c.radius:Math.max(.6,c.r+.4);marker.scale.set(r,1,r);
 markRing.material.color.set(ok?lin(0xffffff):lin(0xff4a3a));markDisc.material.color.set(ok?lin(0x9fd0ff):lin(0xff4a3a));}

addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>10)drag.moved=true;if(drag.moved)showMarker(e.clientX,e.clientY);});
addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;if(!d.moved)return;const handTop=$('#hand').getBoundingClientRect().top;
  if(e.clientY<handTop-4)tryDeploy(e.clientX,e.clientY);marker.visible=false;if(G&&G.sel<0)forbid.visible=false;});

   <div class="row"><span class="ico coin" style="position:static;transform:none"></span><div class="grow"><b>Sac d'or</b><small>+500 or</small></div><button class="gbtn y" data-buy="bag">25 <span class="ico gem sm"></span></button></div>
   <div class="row"><span class="ico coin" style="position:static;transform:none"></span><div class="grow"><b>Coffre au trésor</b><small>Entre 900 et 2 000 or</small></div><button class="gbtn y" data-buy="chest">60 <span class="ico gem sm"></span></button></div>
   <div class="row"><span class="lvlshield" style="position:static;transform:none">+</span><div class="grow"><b>Parchemin d'expérience</b><small>+60 XP de roi</small></div><button class="gbtn y" data-buy="xp">300 <span class="ico coin sm"></span></button></div></div>`);},
 clan(){openSheet('Clan',`<p class="ptxt">Les clans arrivent bientôt : tu pourras rejoindre des amis, échanger des cartes et faire des guerres de clans.</p><p class="ptxt">En attendant, entraîne-toi dans l'arène et monte en trophées.</p><button class="gbtn y" data-close="1">Compris</button>`);},
 events(){PAGES.event();},
 event(){const done=P.eventDay===today();openSheet('Défi du jour',`<p class="ptxt">L'adversaire joue avec des cartes d'un niveau au-dessus et produit son élixir 20 % plus vite. Une victoire rapporte le double d'or et 15 gemmes.</p><button class="gbtn y" data-ev="1" ${done?'disabled':''}>${done?'Reviens demain':'Lancer le défi'}</button>`);},
 profile(){const xi=xpInfo();openSheet('Profil',`<label class="ptxt" for="nameIn">Nom du joueur</label><input id="nameIn" class="inp" maxlength="16" value="${P.name.replace(/"/g,'&quot;')}"><div style="height:10px"></div>
   <div class="rows"><div class="row"><div class="grow"><b>Niveau de roi ${xi.l}</b><small>${P.games} combats · ${P.wins} victoires · ${P.towers} tours détruites</small></div></div>
   <div class="row"><span class="cup"></span><div class="grow"><b>${fmt(P.trophies)} trophées</b><small>Arène ${arenaIdx(P.trophies)+1} · ${ARENAS[arenaIdx(P.trophies)][1]}</small></div></div></div><div style="height:12px"></div><button class="gbtn" data-save="1">Enregistrer</button>`);},
 news(){openSheet('Nouveautés',`<p class="ptxt"><b>Nouvel accueil</b> : arène flottante en 3D, passe des couronnes, quêtes, coffre gratuit et défi du jour.</p><p class="ptxt"><b>Cartes</b> : améliore tes cartes avec de l'or. Chaque niveau donne +10 % de points de vie et de dégâts.</p><p class="ptxt"><b>Graphismes</b> : rendu plus net sur les écrans haute définition.</p>`);},
 settings(){openSheet('Réglages',`<div class="rows"><div class="row"><div class="grow"><b>Son</b><small>Effets sonores en combat</small></div><button class="gbtn ${P.sound?'':'r'}" data-snd="1">${P.sound?'Activé':'Coupé'}</button></div>
   <div class="row"><div class="grow"><b>Réinitialiser</b><small>Efface trophées, or et niveaux de cartes</small></div><button class="gbtn r" data-reset="1">Effacer</button></div></div>`);},
 pass(){const ok=P.passCrowns>=10;openSheet('Passe des Couronnes',`<p class="ptxt">Gagne 10 couronnes en combat pour ouvrir le palier ${P.passLvl}. Récompense : ${200+P.passLvl*50} or et 10 gemmes.</p>
   <div class="row"><div class="grow"><b>Palier ${P.passLvl}</b><div class="pbar"><i style="width:${Math.min(100,P.passCrowns*10)}%"></i></div><small>${Math.min(10,P.passCrowns)} / 10 couronnes</small></div><button class="gbtn y" data-pass="1" ${ok?'':'disabled'}>Récupérer</button></div>`);},
 quests(){const Q=[['wins','Gagner des combats',P.wins,'+80 or'],['cards','Jouer des cartes',P.played,'+50 or'],['towers','Détruire des tours',P.towers,'+15 gemmes']];
   openSheet('Quêtes',`<div class="rows">${Q.map(([k,n,v,r])=>`<div class="row"><div class="grow"><b>${n}</b><div class="pbar"><i style="width:${Math.min(100,v/P.q[k]*100)}%"></i></div><small>${Math.min(v,P.q[k])} / ${P.q[k]} · ${r}</small></div><button class="gbtn y" data-q="${k}" ${v>=P.q[k]?'':'disabled'}>Récupérer</button></div>`).join('')}</div>`);},
 chest(){const left=P.chestAt-Date.now();openSheet('Coffre gratuit',`<p class="ptxt">Un coffre gratuit toutes les 4 heures, avec de 60 à 180 or.</p>${left>0?`<p class="ptxt"><b>Prochain coffre dans ${Math.floor(left/3600000)}h ${Math.ceil(left%3600000/60000)}min</b></p>`:''}<button class="gbtn y" data-chest="1" ${left>0?'disabled':''}>Ouvrir</button>`);},
 badges(){const B=[['Premier sang','Gagner 1 combat',P.wins>=1],['Démolisseur','Détruire 10 tours',P.towers>=10],['Vétéran','Jouer 25 combats',P.games>=25],['Forgeron','Une carte au niveau 5',DECK.some(k=>P.lv[k]>=5)],['Champion','Atteindre 1 000 trophées',P.trophies>=1000]];
   openSheet('Succès',`<div class="rows">${B.map(([n,d,ok])=>`<div class="row" style="${ok?'':'opacity:.5'}"><div class="grow"><b>${ok?'★ ':''}${n}</b><small>${d}</small></div></div>`).join('')}</div>`);},
 road(){const ai=arenaIdx(P.trophies);openSheet('Route des trophées',`<div class="rows">${ARENAS.map((a,i)=>`<div class="road-item ${i===ai?'cur':i>ai?'lock':''}"><span class="cup"></span><div class="grow"><div class="rn">Arène ${i+1} · ${a[1]}</div><small>${a[0]} trophées${i===ai?' · tu es ici':''}</small></div></div>`).join('')}</div>`);},
};
function cardDetail(k){const c=CARDS[k],l=P.lv[k],m=1+.1*(l-1),cost=upCost(l);
 return `<div class="detail"><img src="${THUMB[k]||''}" alt=""><div class="dg"><span>Carte</span><b>${c.name}</b><span>Niveau</span><b>${l} / 10</b><span>Élixir</span><b>${c.cost}</b>
  ${c.spell?`<span>Dégâts</span><b>${Math.round(c.dmg*m)}</b><span>Rayon</span><b>${c.radius}</b>`:`<span>Points de vie</span><b>${Math.round(c.hp*m)}${c.n>1?' ×'+c.n:''}</b><span>Dégâts</span><b>${Math.round(c.dmg*m)}</b><span>Portée</span><b>${c.range<1?'Mêlée':c.range}</b><span>Cible</span><b>${c.tg==='buildings'?'Tours':c.tg==='all'?'Sol et air':'Sol'}</b>`}
  <span style="grid-column:1/-1;margin-top:4px">${cardDesc[k]}</span></div>
  <button class="gbtn" data-up="${k}" style="width:100%" ${l>=10||P.gold<cost?'disabled':''}>${l>=10?'Niveau maximum':'Améliorer · '+fmt(cost)+' <span class="ico coin sm"></span>'}</button></div>`;}
$('#sBody').addEventListener('click',e=>{const d=e.target.closest('button');if(!d)return;
 if(d.dataset.c){selCard=d.dataset.c;PAGES.cards();return;}
 if(d.dataset.up){const k=d.dataset.up,c=upCost(P.lv[k]);if(P.gold<c)return;P.gold-=c;P.lv[k]++;P.xp+=10+P.lv[k]*4;saveP();snd('crown');toast2(CARDS[k].name+' niveau '+P.lv[k]+' !');PAGES.cards();refreshHome();return;}
 if(d.dataset.buy){const b=d.dataset.buy;if(b==='free'){P.gems+=10;P.gemDay=today();toast2('+10 gemmes');}
   else if(b==='bag'){if(P.gems<25)return toast2('Pas assez de gemmes');P.gems-=25;P.gold+=500;toast2('+500 or');}
   else if(b==='chest'){if(P.gems<60)return toast2('Pas assez de gemmes');P.gems-=60;const g=Math.round(rnd(900,2000));P.gold+=g;toast2('+'+fmt(g)+' or');}
   else if(b==='xp'){if(P.gold<300)return toast2("Pas assez d'or");P.gold-=300;P.xp+=60;toast2('+60 XP');}
   snd('crown');saveP();PAGES.shop();refreshHome();return;}
 if(d.dataset.close){closeSheet();return;}
 if(d.dataset.ev){P.eventDay=today();saveP();closeSheet();matchMode='defi';startMatch();return;}
 if(d.dataset.save){const v=($('#nameIn').value||'').trim().slice(0,16);if(v)P.name=v;saveP();closeSheet();return;}
 if(d.dataset.snd){P.sound=!P.sound;saveP();PAGES.settings();return;}
 if(d.dataset.reset){if(d.dataset.sure){const n=P.name;localStorage.removeItem(PKEY);loadP();P.name=n;saveP();closeSheet();toast2('Progression effacée');}else{d.dataset.sure='1';d.textContent='Confirmer ?';}return;}
 if(d.dataset.pass){if(P.passCrowns<10)return;P.passCrowns-=10;P.gold+=200+P.passLvl*50;P.gems+=10;P.passLvl++;saveP();snd('crown');toast2('Palier récupéré !');PAGES.pass();refreshHome();return;}
 if(d.dataset.q){const k=d.dataset.q,v=k==='wins'?P.wins:k==='cards'?P.played:P.towers;if(v<P.q[k])return;if(k==='towers')P.gems+=15;else P.gold+=k==='wins'?80:50;P.q[k]=Math.round(P.q[k]*2);saveP();snd('crown');toast2('Quête terminée !');PAGES.quests();refreshHome();return;}
 if(d.dataset.chest){if(Date.now()<P.chestAt)return;const g=Math.round(rnd(60,180));P.gold+=g;P.chestAt=Date.now()+4*3600e3;saveP();snd('crown');toast2('+'+g+' or');PAGES.chest();refreshHome();return;}});
function reward(win,draw,crowns,towers){P.games++;P.towers+=towers;P.crowns+=crowns;P.passCrowns+=crowns;let gold=win?35+crowns*15:draw?15:8;if(matchMode==='defi'&&win){gold*=2;P.gems+=15;}if(win)P.wins++;P.gold+=gold;P.xp+=win?14:5;saveP();return gold;}

/* ============ DIORAMA 3D ============ */
function initDio(){const cv=$('#dio');let r;try{r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});}catch(e){return;}
 r.setPixelRatio(Math.min(devicePixelRatio||1,2.5));r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.1;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,1,.5,200);sc.add(new THREE.HemisphereLight(lin(0xd8ecff),lin(0x5a3a8a),.75));
 const s=new THREE.DirectionalLight(lin(0xfff1d8),2.4);s.position.set(-8,16,10);s.castShadow=true;s.shadow.mapSize.set(1024,1024);Object.assign(s.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:50});s.shadow.bias=-.0005;sc.add(s);
 const rim=new THREE.DirectionalLight(lin(0xff6aa8),1.1);rim.position.set(10,4,-8);sc.add(rim);const rim2=new THREE.DirectionalLight(lin(0x5aa0ff),1);rim2.position.set(-10,3,-6);sc.add(rim2);
 const root=new THREE.Group();sc.add(root);
 /* île principale */
 const isl=new THREE.Group();root.add(isl);
 const topMat=[M.stone,M.stone,std({map:texFrom(arenaC,[2,2.5]),roughness:.95}),M.stoneD,M.stone,M.stone];
 const slab=new THREE.Mesh(uvScale(new THREE.BoxGeometry(7,.7,8.6),3,.4),topMat);slab.castShadow=slab.receiveShadow=true;slab.position.y=-.35;isl.add(slab);
 const under=new THREE.Mesh(new THREE.ConeGeometry(5,6.5,9,3),M.rock);under.rotation.x=Math.PI;under.scale.set(.82,1,1.02);under.position.y=-3.95;under.castShadow=true;isl.add(under);
 const pos=under.geometry.attributes.position;for(let i=0;i<pos.count;i++){if(pos.getY(i)<3.2){pos.setX(i,pos.getX(i)*rnd(.85,1.12));pos.setZ(i,pos.getZ(i)*rnd(.85,1.12));}}under.geometry.computeVertexNormals();
 for(let i=0;i<22;i++){const a=i/22*6.28,rr=rnd(3.3,4.2);const k=add(isl,DO(rnd(.4,.9)),i%3?M.rock:M.stoneD,Math.cos(a)*rr*.85,rnd(-1.4,-.2),Math.sin(a)*rr);k.rotation.set(rnd(0,3),rnd(0,3),0);}
 for(let i=0;i<14;i++){const a=rnd(0,6.28);const g=add(isl,new THREE.IcosahedronGeometry(rnd(.18,.35),0),M.leaf2,Math.cos(a)*rnd(3.1,3.4),rnd(-.6,-.1),Math.sin(a)*rnd(3.6,4.2));g.scale.y=.6;}
 /* mini-arène */
 const sand=std({map:texFrom(sandC,[1,3]),roughness:1});[-1.7,1.7].forEach(x=>{add(isl,BX(.9,.02,7.4),sand,x,.012,0,false);});add(isl,BX(4.3,.02,.8),sand,0,.012,3.3,false);add(isl,BX(4.3,.02,.8),sand,0,.012,-3.3,false);
 const wt=texFrom(waterC,[2,1]);const wm=std({map:wt,roughness:.08,metalness:.15,transparent:true,opacity:.92,emissive:0x0a3550});add(isl,BX(7.02,.06,.9),wm,0,-.02,0,false);
 [-1.7,1.7].forEach(x=>{add(isl,BX(.9,.12,1.3),M.wood,x,.05,0);});
 [[0,3.9,0,true],[-1.7,2.6,0,false],[1.7,2.6,0,false],[0,-3.9,1,true],[-1.7,-2.6,1,false],[1.7,-2.6,1,false]].forEach(([x,z,t,k])=>{const tw=tower(t,k);tw.scale.setScalar(.3);tw.position.set(x,0,z);isl.add(tw);});
 /* cascade */
 const fall=texFrom(waterC,[1,3]);fall.rotation=Math.PI/2;const fm=std({map:fall,transparent:true,opacity:.85,roughness:.1,emissive:0x1a5a80,side:THREE.DoubleSide,depthWrite:false});
 [-1,1].forEach(sd=>{const f=new THREE.Mesh(new THREE.PlaneGeometry(.85,5.5),fm);f.position.set(sd*3.52,-2.75,0);f.rotation.y=Math.PI/2;isl.add(f);
   for(let i=0;i<6;i++){const m=add(isl,SP(.22,8,6),std({color:0xffffff,transparent:true,opacity:.7}),sd*3.6,-5.4,rnd(-.4,.4),false);m.userData.mist=rnd(0,6);}});
 /* statue royale en pierre */
 const st=human('king',0);st.traverse(o=>{if(o.isMesh&&o.material!==M.gold)o.material=M.stone;});st.scale.setScalar(4.2);st.position.set(0,-.2,-4.9);isl.add(st);
 const ud=st.userData;ud.armR.rotation.x=-.3;ud.armL.rotation.x=-.3;
 const sw=new THREE.Group();sw.position.set(0,1.2,-3.35);isl.add(sw);add(sw,BX(.32,3,.08),M.steel,0,1.2,0);add(sw,BX(1.2,.2,.24),M.gold,0,2.7,0);add(sw,BX(.2,.8,.2),M.leather,0,3.2,0);add(sw,SP(.2,10,8),M.gold,0,3.7,0);
 for(let i=0;i<8;i++){const k=add(isl,DO(rnd(.4,.8)),M.rock,rnd(-2.6,2.6),.15,rnd(-4.4,-3.9));k.rotation.set(rnd(0,3),rnd(0,3),0);k.scale.y=.6;}
 /* îlots */
 const mini=[];function islet(x,y,z,sz,deco){const g=new THREE.Group();g.position.set(x,y,z);root.add(g);const t=new THREE.Mesh(new THREE.CylinderGeometry(sz,sz*.9,.35,8),[M.stone,std({map:texFrom(grassC,[1,1])}),M.stoneD]);t.castShadow=t.receiveShadow=true;g.add(t);
   const u=add(g,new THREE.ConeGeometry(sz*.9,sz*1.6,8),M.rock,0,-sz*.8-.17,0);u.rotation.x=Math.PI;deco(g,sz);g.userData.by=y;g.userData.ph=rnd(0,6);mini.push(g);return g;}
 islet(-5.6,1.5,-1.5,1.1,(g)=>{add(g,CY(.12,.16,.8,8),M.trunk,0,.55,0);add(g,new THREE.IcosahedronGeometry(.6,0),M.leaf,0,1.2,0);add(g,new THREE.IcosahedronGeometry(.42,0),M.leaf2,.2,1.6,.1);});
 islet(5.5,2.2,-1,1.2,(g)=>{add(g,BX(.9,.7,.8),M.wood,0,.53,0);const rf=add(g,CY(.6,.6,1.1,3),std({map:T.tile,color:0x3aa860,roughness:.6}),0,1.1,0);rf.rotation.z=Math.PI/2;rf.rotation.y=Math.PI/2;rf.scale.set(1,.8,1.15);add(g,BX(.25,.35,.05),M.dark,0,.4,.41);});
 islet(-5,-1.6,2.6,.8,(g)=>{const s2=add(g,BX(.08,.9,.03),M.steel,0,.55,0);s2.rotation.z=.2;add(g,BX(.35,.07,.08),M.gold,-.07,.85,0).rotation.z=.2;});
 islet(4.6,-1.9,3,.7,(g)=>{for(let i=0;i<3;i++)add(g,DO(.25),M.rock,rnd(-.3,.3),.3,rnd(-.3,.3));});
 /* nuages */
 const cm=std({color:0xffffff,transparent:true,opacity:.85,roughness:1});const clouds=[];for(let i=0;i<6;i++){const c=new THREE.Group();for(let j=0;j<4;j++)add(c,SP(rnd(.6,1.1),12,10),cm,j*.8-1.2,rnd(-.2,.3),rnd(-.3,.3),false);c.position.set(rnd(-9,9),rnd(-7,-4.5),rnd(-4,5));c.userData.v=rnd(.2,.5);sc.add(c);clouds.push(c);}
 /* étincelles */
 const spk=[];const spm=basic(0xfff1a8);for(let i=0;i<24;i++){const m=new THREE.Mesh(SP(.05,6,4),spm);m.position.set(rnd(-6,6),rnd(-3,5),rnd(-4,4));m.userData.ph=rnd(0,6);sc.add(m);spk.push(m);}
 let drag=null,yaw=0,tYaw=0;cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y0:tYaw};cv.setPointerCapture(e.pointerId);});cv.addEventListener('pointermove',e=>{if(drag)tYaw=drag.y0+(e.clientX-drag.x)*.01;});
 const end=()=>{drag=null;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
 dio={r,sc,cam,root,isl,mini,clouds,spk,wt,fall,t:0,frame(dt){this.t+=dt;const t=this.t;if(!drag)tYaw*=.985;yaw+=(tYaw-yaw)*.08;root.rotation.y=Math.sin(t*.25)*.28+yaw;root.position.y=Math.sin(t*.8)*.12;
   mini.forEach(g=>{g.position.y=g.userData.by+Math.sin(t*1.1+g.userData.ph)*.18;g.rotation.y+=dt*.15;});clouds.forEach(c=>{c.position.x+=c.userData.v*dt;if(c.position.x>11)c.position.x=-11;});
   spk.forEach(m=>{m.position.y+=dt*.4;if(m.position.y>6)m.position.y=-3;const k=.5+.5*Math.sin(t*3+m.userData.ph);m.scale.setScalar(.4+k);});wt.offset.x+=dt*.08;fall.offset.x-=dt*.9;
   isl.traverse(o=>{if(o.userData.mist!=null){o.userData.mist+=dt;const k=(o.userData.mist%1.5)/1.5;o.scale.setScalar(.6+k*1.4);o.position.y=-5.4-k*.6;}if(o.userData.wave)o.rotation.y=Math.sin(t*3+o.position.x)*.3;});
   r.render(sc,cam);}};}
function resizeDio(){if(!dio)return;const cv=$('#dio'),w=cv.clientWidth||300,h=cv.clientHeight||300;dio.r.setSize(w,h,false);dio.cam.aspect=w/h;dio.cam.updateProjectionMatrix();
 const R=8.2,fov=dio.cam.fov*Math.PI/180;const dv=R/Math.sin(fov/2),dh=R/Math.sin(Math.atan(Math.tan(fov/2)*dio.cam.aspect));const d=Math.max(dv,dh)*.82;dio.cam.position.set(0,d*.36,d*.93);dio.cam.lookAt(0,-.6,0);}
addEventListener('resize',()=>{if(homeOn)resizeDio();});
setInterval(()=>{if(homeOn&&P)updTimers();},20000);

/* ============ BOUCLE ============ */
let last=performance.now(),TT=0;
function loop(){requestAnimationFrame(loop);const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;TT+=dt;
 tick(dt);updFX(dt);T.water.offset.x+=dt*.05;T.water.offset.y=Math.sin(TT*.5)*.04;
 if(shake>0){shake=Math.max(0,shake-dt*1.3);}placeCam();
 scene.traverse(o=>{if(o.userData.wave)o.rotation.y=Math.sin(TT*3+o.position.x)*.3;});
 if(crowd){crowd.body.position.y=crowd.head.position.y=Math.abs(Math.sin(TT*(G&&!G.over?6:2)))*.05;}
 if(!G||G.over){camTarget.x=Math.sin(TT*.15)*.6;}
 if(homeOn){if(dio)dio.frame(dt);}else{updLabels();renderer.render(scene,camera);}}
loadP();showHome();resize();loop();
})();
